病患，若考慮施打血栓溶解劑時，需注意有無禁忌症，下列何者為血栓溶解\n療法(fibrinolytic therapy)之絕對禁忌症？", "options": ["無法控制之高血壓(＞180/110 mmHg)", "懷孕婦女(pregnancy)", "活動性消化道出血", "三個月內有過缺血性中風(不含三小時內之急性缺血性中風)"], "answer": 2, "explanation": "患者有活動性的消化道出血症狀時，施打血栓溶解劑會造成出血症狀加劇，在ACLS\n內列為絕對禁忌症。"}, {"id": "PDF178", "category": "ACS", "level": "進階", "stem": "65 歲男性，有抽煙史，服用威而剛後與妻子行房時忽然感覺胸痛，至急診求診，血壓為114/75 \nmmHg，12 導程心電圖呈現V2-V5 ST 段上昇。下列治療何者為非？", "options": ["Morphine 3mg IV", "儘快安排心導管治療", "舌下給予NTG", "口服 Aspirin"], "answer": 2, "explanation": "威而剛會加強硝酸鹽藥物的降血壓效果，造成血壓過低而危及生命"}, {"id": "PDF179", "category": "ACS", "level": "進階", "stem": "心導管執行PCI(包括血管整型術及置入支架)，下列何者是ClassⅠ之治療？", "options": ["50 歲NSTEMI 病人，剛發作，且無「高危險性」之因子", "75 歲NSTEMI 病人，發作6 小時，嚴重左心室功能異常及心因性休克", "心肌酵素未升高，ST 波段下降，且對於初步治療有反應", "下壁之STEMI 發生16 小時，沒有休克或左心室功能異常"], "answer": 1, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF180", "category": "ACS", "level": "進階", "stem": "哪種STEMI(ST Elevation Myocardial Infarct)病患需要做右側心電圖？", "options": ["V1-3 ST 段升高", "V4-6 ST 段升高", "II、III、aVF ST 段升高", "全部STEMI 都需要"], "answer": 2, "explanation": "心電圖上呈現II、III、aVF ST 段升高會懷疑是下壁心肌梗塞，而右心室梗塞在心電圖\n上也會看起來像是下壁心肌梗塞，這時要做一張右側心電圖來判讀Ｖ4 導極是否有ST 節段上\n升，如果Ｖ4 有ST 段上升就合併有右心室梗塞。右心室梗塞會導致右心衰竭，處理的方式與\n一般心肌梗塞較不相同。"}, {"id": "PDF181", "category": "ACS", "level": "進階", "stem": "關於STEMI 病人的藥物治療，下列何者正確?", "options": ["即使病人有心搏過緩，也應於急診就醫時立即給予β-blocker，以保護心臟", "若無禁忌症，病人合併有肺水腫或左心室輸出量小於40%時，建議發作後24 小時內給予\nACEI 或ARB", "STEMI 病人皆不需要接受降血脂治療", "STEMI 病人接受心導管介入治療前不需要服用雙抗血小板藥物治療 \n---PAGE 50---\n2026.01 \n50 \n中華急救教育推廣協會ACLS 練習題"], "answer": 1, "explanation": "B-blocker 有諸多禁忌症，臨床上給予前須預先確認。心搏過慢者不適合使用"}, {"id": "PDF182", "category": "ACS", "level": "進階", "stem": "下列何者為急性冠心症的診斷條件？", "options": ["臨床症狀", "心電圖變化", "心肌酵素", "以上三項符合兩項即可"], "answer": 3, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF183", "category": "ACS", "level": "進階", "stem": "針對NSTEMI 病人的治療，下列何者正確?", "options": ["病人需要及早使用血栓溶解劑", "NSTEMI 病人胸痛惡化，對藥物治療無效時，應立即接受心導管檢查", "治療NSTEMI 病人建議例行性給予B-blocker，以降低死亡率", "NSTEMI 病人不需要持續追蹤心肌酵素、心電圖與臨床症狀"], "answer": 1, "explanation": "NSTEMI 患出現高危險症狀時，須及早介入心導管治療。B-blocker 有諸多禁忌症， \n 臨床上給予前須預先確認。"}, {"id": "PDF184", "category": "ACS", "level": "進階", "stem": "急性冠狀動脈症候群患者於急診室10 分鐘之內應完成的評估應包括：", "options": ["評估生命徵象、血氧飽和濃度、病史詢問與身體檢查", "抽血檢驗心肌酵素、全血球數與凝血測試", "做12 導程心電圖與判讀", "以上皆是"], "answer": 3, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF185", "category": "ACS", "level": "進階", "stem": "75 歲男性，意識清楚，主訴前胸有嚴重壓迫性胸痛且疼痛會傳到下巴與上臂，臉色蒼白、冒\n冷汗，血壓：100/60mmHg，心跳：192/min，呼吸：22/min，SpO2： 90%，心電圖呈現單型\n性VT(monomorphic VT)，建議治療方式為：", "options": ["O2、 IV、CPR，100J 同步電擊", "O2、 IV、給鎮靜劑，100J 同步電擊", "O2、 IV、給鎮靜劑，200J 非同步電擊", "O2、 IV、NTG 舌下含片，Amiodarone 150mg 靜脈注射"], "answer": 1, "explanation": "病人有休克症狀，為不穩定之心搏過速，應給予同步整流100J \n \n \n \n \n---PAGE 51---\n2026.01 \n51 \n中華急救教育推廣協會ACLS 練習題 \n急性腦中風治療(CVA)"}, {"id": "PDF187", "category": "Stroke", "level": "進階", "stem": "急性腦中風急救時，下列何者較不合適？", "options": ["到院後醫護人員應立即在急診室或電腦斷層掃描室進行一般性及神經學評估", "設立靜脈路徑時，儘量使用5%葡萄糖水，以增加腦細胞之存活性", "到院後20 分鐘內，應完成電腦斷層掃描", "到院後45 分鐘內，完成電腦斷層判讀"], "answer": 1, "explanation": "對於急性腦中風病人，不要單獨使用只含糖份的點滴，避免血糖增加及加重腦水腫。 \n2020 stroke update："}, {"id": "PDF188", "category": "Stroke", "level": "進階", "stem": "急性缺血性中風患者給予tPA 治療，下列何者可用tPA？", "options": ["年齡18 歲以上，臨床診斷為缺血性中風且有神經學功能缺損，症狀開始時間在4.5 小時\n內", "年齡70 歲以下，電腦斷層有高密度顯影疑似腦出血，且有神經缺陷", "年齡18 歲以上，臨床診斷為缺血性中風且有神經缺陷，症狀開始時間在4.5 小時內， 症\n狀開始後曾有癲癇發作", "年齡70 歲以下，診斷為缺血性中風且有神經缺陷，早上睡醒時發現左邊癱瘓，無法確認\n發作時間"], "answer": 0, "explanation": "tPA 目前要大於18 歲，缺血性中風症狀開始在4.5 小時內且無其它禁忌症。曾有癲癇\n發作者不可使用，無法確認發作時間也不可使用。"}, {"id": "PDF189", "category": "Stroke", "level": "進階", "stem": "有關中風之治療，下列描述何者錯誤", "options": ["大多數腦中風病人的血壓，會在疼痛、躁動、腦壓受控制後自然降低", "缺血性中風，BP>220/120 才要緊急降壓", "4.5 小時內給t-PA 治療，死亡率都有明顯下降", "以t-PA 治療缺血性中風之劑量為0.9mg/kg，最大量不超過90mg"], "answer": 2, "explanation": "缺血性中風病人若不適合打t-PA，且沒有其他器官問題(如心血管)，血壓在220/120 內\n只要處理頭痛、嘔吐、噪動，缺氧、IICP、血糖等問題即可，不用積極降壓。4.5 小時內給t-PA\n治療，可以減少神經學損傷，但不能降低死亡率。 \n---PAGE 52---\n2026.01 \n52 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF190", "category": "Stroke", "level": "進階", "stem": "在急性中風時，ACLS 指導原則，下列何者為誤？", "options": ["救護人員以辛辛那提到院前以及中風嚴重指數評估病人並通知醫院可能有中風病患，及\n快速送醫", "到院後，立即進行一般性及神經學評估", "設立靜脈路徑時，要用生理食鹽水", "到院後20 分鐘內，立即進行神經學評估；45 分鐘內安排緊急無顯影劑之電腦斷層掃描，\n60 分鐘內判讀無顯影劑之電腦斷層掃描結果"], "answer": 3, "explanation": "Cincinnati 包含Facial droop、Arm drift 和Abnormal speech 三項，若是三項有一個以上，\n中風的可能性是72%。急性中風病人靜脈路徑不要只使用葡萄糖液，可用生理食鹽水。到院\n後20 分內做完電腦斷層掃描，45 分內完成電腦斷層較為理想。"}, {"id": "PDF191", "category": "Stroke", "level": "進階", "stem": "70 歲住院男性，1 小時前突然右側無力，醫師初步懷疑腦中風，以下處置何者較不適當?", "options": ["立即驗血糖，血糖值為40mg/dL，給予50%葡萄糖溶液", "血氧濃度為90%，給予氧氣治療", "初步測量血壓為200/100mmHg，應立即給予labetalol 10 mg 靜脈注射，以免中風惡化", "電腦斷層顯示無腦出血，會診神經科醫師評估後表示NIHSS 為3 分，不須給予血栓溶解\n劑"], "answer": 2, "explanation": "血氧濃度小於94%，應給予氧氣治療。目前可以施打IV tPA 的NIHSS 為4-25 分，一\n般缺血性腦中風病患的血壓須控制在220/120 以下，而須施打tPA 的缺血性腦中風患者，血壓\n則必須控制在185/110 以下，若為出血性中風，收縮壓則希望能控制在140 以下。因此，中風\n病人之血壓控制須考慮中風類型及是否須施打 tPA 才可決定，本題患者在診斷及病況尚未確\n認前，不宜貿然施打LABETALOL 降血壓藥物。如為缺血性腦中風且不須施打tPA 患者，給\n予降血壓藥物將降低腦部灌流，反而使得缺血更嚴重。"}, {"id": "PDF192", "category": "Stroke", "level": "進階", "stem": "馬先生，58 歲男性，有高血壓病史10 年，因懷疑急性缺血性腦中風被送至急診室。腦部電腦\n斷層檢查馬上被安排實施完成，顯示並無顱內出血現象。馬先生的症狀開始於2 小時前，並\n且無相關使用rt-PA 治療的禁忌，但是此時馬先生的血壓為200/120 mmHg。此時，您可以選\n擇下列何者藥物？", "options": ["Labetalol 10-20mg IV; may repeat 1 or 2 times", "Nitroprusside 20mg IV", "Sublingual Nifedipine", "Apresoline 50mg po"], "answer": 0, "explanation": "急性腦中風病人若是使用tPA 的候選時，收縮壓180 至230 或舒張壓105 至120 時可\n用Labetalol 10 mg IV for 1 to 2 min，可每10至20分鐘重復或用雙倍劑量直至最大劑量300 mg。\n收縮壓>230 或舒張壓121 至140 時除Labetalol 外可使用Nicarpidine 5 mg/h IV infusion，然後\n根據血壓調整劑量。舒張壓140 時，可用Sodium nitroprusside 0.5 μg/kg/min IV infusion，然後\n根據血壓調整劑量。 \n \n---PAGE 53---\n2026.01 \n53 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF193", "category": "Stroke", "level": "進階", "stem": "對急性缺血性腦中風病患到急診後，建議高血壓的控制處置，下列何者治療敘述不適當？", "options": ["SBP＞220、DBP＞120：可使用Labetalol 10- 20 mg 靜脈注射", "SBP＞220、DBP＞120：可使用 Nicardipine 靜脈滴注", "DBP＞140：應使用 NTG 靜脈滴注以使DBP 下降10-15%", "過度的高血壓控制可能會降低大腦的灌注血流"], "answer": 2, "explanation": "急性腦中風病人若是使用tPA 的候選時，收縮壓180 至230 或舒張壓105 至120 時可\n用Labetalol 10 mg IV for 1 to 2 min，可每10至20分鐘重復或用雙倍劑量直至最大劑量300 mg。\n收縮壓>230 或舒張壓121 至140 時除Labetalol 外可使用Nicarpidine 5 mg/h IV infusion，然後\n根據血壓調整劑量。舒張壓140 時，可用Sodium nitroprusside 0.5 μg/kg/min IV infusion，然後\n根據血壓調整劑量。"}, {"id": "PDF194", "category": "Stroke", "level": "進階", "stem": "以下徵兆及症狀與急性腦中風可能類似？", "options": ["低血糖", "急性心肌梗塞", "壓力性氣胸", "有脈搏的W-P-W 症候群心搏過速"], "answer": 0, "explanation": "低血糖的病患可能會出現肢體無力、動作笨拙、說話困難、迷亂、神志喪失、癲癇等\n等症狀，有些會與中風的症狀類似，因此疑似中風者須立即檢查血糖以排除低血糖。"}, {"id": "PDF195", "category": "Stroke", "level": "進階", "stem": "關於缺血性腦中風患者tPA 的治療，以下何者為是？", "options": ["使用劑量為病患體重每公斤0.9 mg(0.9 mg/Kg)，其中10%快速靜注，其餘滴注60 分鐘。\n為了快速打通血管，並沒有最高限制劑量", "使用tPA 後，如果病人意識不清，應立即置放導尿管及鼻胃管", "給予tPA 的24 小時內，禁止中心靜脈導管置放", "給予tPA 後為了嚴密監測血壓病患，應放置動脈導管(A-line)監測"], "answer": 2, "explanation": "(A)最大劑量為90mg (B)給藥後的30 分鐘內宜避免放置到導尿管，24 小時內儘可能不\n要放鼻胃管(D)應避免放置動脈導管"}, {"id": "PDF196", "category": "Stroke", "level": "進階", "stem": "一名45 歲病患，在中風症狀發生後一小時之內被送到某醫學中心。經過頭部電腦斷層檢查、\n急診科與神經內科醫師的評估，病患符合施打血栓溶解劑tPA 的條件。家屬很焦急的詢問有\n關tPA 的禁忌症。下列何者非急性梗塞性腦中風的病患使用血栓溶解劑(tPA)的禁忌症？", "options": ["National Institute of Health Stroke Scale(NIHSS)大於25 分", "頭部電腦斷層正常，但臨床症狀高度懷疑蜘蛛膜下腔出血時", "中風症狀發生時，病患有癲癇(Witnessed seizure)的表現", "在治療開始前，病患血壓維持在170/110 mmHg"], "answer": 3, "explanation": "若血壓大於185/110mmHg 需使用藥物降血壓，如果用藥後血壓仍然無法降到\n185/110mmHg 以下，勿使用tPA \n---PAGE 54---\n2026.01 \n54 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF197", "category": "Stroke", "level": "進階", "stem": "某天您在某小型醫院的急診室值班，電腦斷層發生不明原因之故障，無法進行作業。一小時\n之後，一位60 歲男性病患被家屬送到急診，告訴您該病患在半小時之前突然右側無力，講話\n不清楚，吞口水頻頻嗆到並嘔吐。您檢視該名病患時，發現他的Glascow Coma Scale 只有\nE2V2M4，血壓170/100 mmHg，心跳每分鐘120 下，下列的處置何者錯誤？", "options": ["儘速給予Aspirin 的治療，在維持呼吸道的情況之下，儘速轉院到有頭部電腦斷層的醫院\n進行進一步處理", "維持呼吸道的暢通，必要時給予插管，儘速轉院至有頭部電腦斷層的醫院", "病人血壓雖然偏高，但目前不考慮給予降血壓之藥物治療", "雖然心電圖(ECG)是中風治療的常規處置之一，但仍不可以因為作ECG 而耽誤了轉院以\n獲取頭部電腦斷層的時間"], "answer": 0, "explanation": "建議先完成腦部電腦斷層，確定腦部無出血，再給Aspirin"}, {"id": "PDF198", "category": "Stroke", "level": "進階", "stem": "某60 歲男性平日健康狀態良好，沒有心臟血管的疾病，沒有在服用任何口服抗凝血劑(oral \nanticoagulants)或heparin 的治療。某日，他於中風發作兩小時之後被送到貴院急診，於中風發\n作2 小時45 分鐘之後完成整體評估，符合施打血栓溶解劑(tPA)的條件，唯有international \nnormalized ratio(INR)和activated partial thromboplastin time (aPTT)因實驗室故障而暫缺檢驗報\n告，須等待30 分鐘之後才有結果。以下處置何者有誤？", "options": ["仍應盡速給予tPA 治療，不可以因為等待INR 或aPTT 的檢驗結果而擔誤了病人治療的\n黃金時間", "給予tPA 治療的出血風險很高，應該等到INR 和aPTT 的數據之後再考慮給予", "仍應儘速給予tPA 治療。如果之後的INR 檢驗結果大於1.7 或aPTT 大於實驗室標準值，\n必須停止tPA 治療。", "給予tPA 治療之後的24 小時之內不可以給予抗凝血劑(Anticoagulant)或抗血小板 \n(Antiplatelet)的藥物"], "answer": 1, "explanation": "檢驗凝血功能是治療過程中最耗費時間的一個檢驗。當遇到病人臨床上評估符合施打\n條件，但凝血報告尚未出來時，該如何處置?依照腦中風醫學會建議：病人如未曾使用抗凝血\n劑，在未能及時有凝血資料下，仍可以逕行治療，但在治療中，若檢驗確認：aPTT 數值有延\n長，或，INR 超過 1.7，則應即時停止輸液，並密切觀察可能的併發症。有可能使用過抗凝血\n劑的病人則應在獲得這些凝血資料下才可以考慮治療。"}, {"id": "PDF199", "category": "Stroke", "level": "進階", "stem": "70歲男性患者因為疑似中風急性發作，於發作後30分鐘內被送到貴院急診室。病人意識清楚，\n血壓180/108 mmHg，體溫38.3℃，血糖160 mg/dL，唯獨左側肢體無力，電腦斷層無腦出血、\n無腦腫瘤或腦膿瘍。有關急性缺血性腦中風的治療，以下處置何者有誤？", "options": ["血壓180/108 偏高，可能使中風更惡化，應給予藥物治療", "中風的病人合併癲癇是施打tPA 的禁忌症。", "病人體溫偏高，應給予降溫，因為體溫偏高會增加腦部耗氧", "病人血糖值仍在可接受的範圍之內，暫不需要給予降血糖的治療 \n---PAGE 55---\n2026.01 \n55 \n中華急救教育推廣協會ACLS 練習題"], "answer": 0, "explanation": "急性缺血性中風患者血壓如未超過220/120，暫不須降壓，以免使腦灌流減少而使缺血\n更惡化。"}, {"id": "PDF200", "category": "Stroke", "level": "進階", "stem": "有關急性腦中風一般照護，何者較不適當?", "options": ["若血糖值＞200 mg/dL 以上，可給予胰島素治療", "給予靜脈補充生理食鹽水，給予的流速約為75 ml/hr", "常規給予Dilantin(Phenytoin)，以預防癲癇發作", "評估病患吞嚥功能，若有嗆到可能性，可考慮鼻胃管餵食"], "answer": 2, "explanation": "癲癇會加重中風的嚴重度，必須加以控制，但不需要特別去預防，不需要特別投予抗\n癲癇藥物Dilantin(Phenytoin)"}, {"id": "PDF201", "category": "Stroke", "level": "進階", "stem": "您在急診室值班，EMS 送來一65 歲男性，主訴10 分鐘前突然說話不清，肢體無力。經您的\n評估後，發現病患右側手腳無力，左臉下垂，說話不清但意識清楚。根據2020 年ACLS 的原\n則，此病患症狀開始在3 小時內，下列處置何者錯誤？", "options": ["應在到達急診立即做完一般評估及神經學評估", "應在45 分鐘內判讀電腦斷層", "25 分鐘內完成電腦斷層掃描", "經評估此病患為適合施打纖維蛋白溶解治療的候選人，此時護理師回報病患血壓突升至\n212/116 mmHg，應給予觀察即可"], "answer": 3, "explanation": "若血壓大於185/110mmHg 需使用藥物降血壓，如果用藥後血壓仍然無法降到\n185/110mmHg 以下，勿使用tPA"}, {"id": "PDF202", "category": "Stroke", "level": "進階", "stem": "急性缺血性中風病患若要使用tPA，血壓應控制在多少以下？", "options": ["220/120 mmHg", "185/110 mmHg", "170/95 mmHg", "140/90 mmHg"], "answer": 1, "explanation": "若血壓大於185/110mmHg 需使用藥物降血壓，如果用藥後血壓仍然無法降到\n185/110mmHg 以下，勿使用tPA"}, {"id": "PDF203", "category": "Stroke", "level": "進階", "stem": "76 歲男性被發現倒臥在家中客廳地板，家人打電話給119，EMT 到患者家中用辛辛那提評估，\n發現患者有左側手腳無力、說話口齒不清、臉部下垂，疑似中風，以下何者處置正確？", "options": ["到達病患家中建議用中風嚴重指數判斷病患是否有大血管栓塞", "判斷患者有中風可能性，應該將患者送至最近可以施打tPA 的醫院", "到達醫院後，若將疑似中風患者直接送至電腦斷層掃描室，可以所短等待電腦斷層掃描\n的時間，增加病患施打tPA 與機械取栓術的機會", "以上皆是 \n---PAGE 56---\n2026.01 \n56 \n中華急救教育推廣協會ACLS 練習題"], "answer": 3, "explanation": "上述均為建議的處置，能縮短中風病人處置的時間。"}, {"id": "PDF204", "category": "Stroke", "level": "進階", "stem": "中風患者施打tPA，下列何者正確？", "options": ["血壓目標值應控制在185-110 到220/120 mmHg 之區間", "不符合施打tPA 的中風患者，也不能考慮顱內血栓移除術", "若中風時間符合且無禁忌症，病患可以先接受tPA 治療後再執行電腦斷層血管攝影術，\n並考慮接受顱內血栓移除術", "若正在服用口服抗凝劑且INR 1.5，可以考慮施打tPA"], "answer": 2, "explanation": "若血壓不能控制在185/110 之內，則不能打tPA。即使不適合施打tPA 的缺血性中風，\n在符合特定條件下，24 小時內還是可以考慮顱內血栓移除術。若正在服用口服抗凝血劑且\nINR>1.3，則不能施打tPA。"}, {"id": "PDF205", "category": "Stroke", "level": "進階", "stem": "70 歲女性因為腦中風症狀被送到急診室，到達醫院時中風症狀已經超過3 小時，依據2020 年\nACLS 中風處理準則，下列何者錯誤？", "options": ["若不符合施打tPA 的條件，中風症狀發生24 小時以上也可以考慮機械取栓術", "若符合條件，中風症狀發生3-4.5 小時，仍然可以考慮使用tPA 並有健保給付", "若不使用tPA，病患仍需要服用抗血小板藥物並住進中風照護中心或神經加護中心", "開始施打tPA，血壓藥控制在185/110mmHg 以下"], "answer": 0, "explanation": "2023.11.1 起，健保給付前後循環24 小時內符合特定條件，可以健保施行顱內血栓移除\n術。2023.10.1 起，中風症狀發生3-4.5 小時，過往須自費使用的tPA 亦改為健保給付。施打tPA\n後24 小時內，須保持血壓在185/110mmHg 內"}, {"id": "PDF206", "category": "Stroke", "level": "進階", "stem": "美國辛辛那提到院前中風計分法包含三項指標，下列何者為非？", "options": ["請患者露出牙齒或微笑時單側臉部下垂", "患者閉眼睛，兩手臂抬起伸直超過10 秒，單側手臂下移", "請患者念一句較難唸的話，有口吃或無法說話", "請患者站起時向單側偏移或步態不穩"], "answer": 3, "explanation": "可使用辛辛納提到院前中風量表(CPSS)來快速確認患者是否為腦中風，只做3 項理學\n檢查項目(選項ABC)，若3 項中有任1 項不正常，中風可能性為72%。"}];
const megacodes = [{"title": "Megacode 1：目擊倒地 VF/pVT", "intro": "58歲男性在急診候診時突然倒地，無反應、無正常呼吸、摸不到脈搏。監視器顯示 VF。", "steps": [{"prompt": "第一步最適當處置？", "options": ["先插管", "立即高品質 CPR 並準備去顫", "先給 epinephrine", "先抽血"], "answer": 1, "explanation": "無脈搏 VF/pVT：立即 CPR、接電擊器、盡快去顫。"}, {"prompt": "第一次雙相去顫後下一步？", "options": ["檢查脈搏", "立即 CPR 2 分鐘", "立即給 amiodarone", "等待心電圖穩定"], "answer": 1, "explanation": "電擊後不檢查脈搏，立即恢復 CPR 2 分鐘以減少中斷。"}, {"prompt": "第二次電擊後仍 VF，下一個藥物？", "options": ["Atropine 1 mg", "Epinephrine 1 mg IV/IO", "Adenosine 6 mg", "Diltiazem"], "answer": 1, "explanation": "VF/pVT 流程中 epinephrine 1 mg IV/IO，每 3–5 分鐘重複。"}, {"prompt": "第三次電擊後仍 VF，可考慮？", "options": ["Amiodarone 300 mg IV/IO", "Atropine 3 mg", "同步整流 50J", "停止 CPR"], "answer": 0, "explanation": "Refractory VF/pVT 可給 amiodarone 300 mg，之後可追加 150 mg。"}]}, {"title": "Megacode 2：PEA 找 5H5T", "intro": "70歲男性 COPD 病史，突然喘、倒地。無脈搏，監視器有窄 QRS 電氣活動，無可電擊心律。", "steps": [{"prompt": "此時心律處置？", "options": ["立即去顫", "CPR + epinephrine + 找 5H5T", "Adenosine", "同步整流"], "answer": 1, "explanation": "PEA 不電擊，重點是高品質 CPR、epinephrine 1 mg q3–5 min、尋找可逆原因。"}, {"prompt": "若單側呼吸音消失、頸靜脈怒張、血壓低，最應懷疑？", "options": ["低血糖", "張力性氣胸", "竇性心搏過緩", "PSVT"], "answer": 1, "explanation": "PEA 中單側呼吸音消失合併 JVD 與休克需高度懷疑 tension pneumothorax，應立即減壓。"}, {"prompt": "CPR 中 ETCO2 持續 <10 mmHg，代表？", "options": ["ROSC", "CPR 品質或灌流不足，需改善按壓", "一定是插管錯誤", "可以停止 CPR"], "answer": 1, "explanation": "低 ETCO2 常提示灌流不足或 CPR 品質需改善，但需同時確認通氣與管路位置。"}]}, {"title": "Megacode 3：不穩定 Bradycardia", "intro": "80歲女性頭暈冒冷汗，BP 70/40 mmHg，HR 35/min，心電圖顯示三度 AV block、寬 QRS。", "steps": [{"prompt": "第一線思考？", "options": ["觀察即可", "給 oxygen、monitor、IV，準備 TCP", "Adenosine", "Amiodarone 300 mg"], "answer": 1, "explanation": "有症狀 bradycardia 先 ABC、氧氣、監測、IV，三度 AV block 合併不穩定需準備 pacing。"}, {"prompt": "此類高階 AV block 最適合的立即治療？", "options": ["TCP 經皮節律器", "非同步去顫", "Lidocaine", "Aspirin"], "answer": 0, "explanation": "高階 AV block 對 atropine 可能反應差，若不穩定應立即 TCP，同時可考慮 dopamine/epinephrine infusion。"}, {"prompt": "若等待 pacing，可考慮哪個輸注藥物？", "options": ["Epinephrine 2–10 mcg/min 或 dopamine 5–20 mcg/kg/min", "Epinephrine 1 mg IV push q3–5min", "Adenosine 12 mg", "Verapamil"], "answer": 0, "explanation": "心搏過緩的升壓/增心跳劑量是 infusion，不是 cardiac arrest 的 1 mg push。"}]}, {"title": "Megacode 4：穩定 PSVT", "intro": "25歲女性突發心悸，BP 110/70 mmHg，意識清楚，規則窄 QRS tachycardia，HR 180/min。", "steps": [{"prompt": "初始處置？", "options": ["去顫 200J", "迷走神經刺激", "Epinephrine 1 mg", "CPR"], "answer": 1, "explanation": "穩定規則窄 QRS PSVT 可先迷走神經刺激，如 modified Valsalva。"}, {"prompt": "若未改善，下一步藥物？", "options": ["Adenosine 6 mg rapid IV push + NS flush", "Amiodarone 300 mg push", "Atropine 1 mg", "NTG 舌下"], "answer": 0, "explanation": "Adenosine 半衰期極短，需快速 IV push，接 20 mL NS flush。"}, {"prompt": "若病人變低血壓、意識改變，下一步？", "options": ["同步整流", "繼續觀察", "只給水分", "口服 beta blocker"], "answer": 0, "explanation": "Tachycardia 合併不穩定徵象時，應立即同步整流。"}]}, {"title": "Megacode 5：ROSC 後照護", "intro": "62歲男性 VF arrest，經去顫與 CPR 後 ROSC，仍昏迷，BP 85/50，SpO2 92%。", "steps": [{"prompt": "ROSC 後第一優先？", "options": ["立刻拔管", "維持氧合通氣與血壓灌流", "停止所有監測", "只等病人醒來"], "answer": 1, "explanation": "ROSC 後先穩定 ABC、避免低氧/過度氧合、避免低血壓，並找病因。"}, {"prompt": "下一個關鍵檢查？", "options": ["12 導程 ECG", "常規腦波先做", "立即胃鏡", "延後抽血"], "answer": 0, "explanation": "ROSC 後需儘速做 12 導程 ECG 評估 STEMI/缺血，決定是否心導管。"}, {"prompt": "昏迷病人的溫度策略？", "options": ["放任發燒", "低溫到 30–32°C", "避免發燒並進行溫度控制/TTM", "只用退燒藥不監測體溫"], "answer": 2, "explanation": "ROSC 後昏迷者需避免發燒，依院內流程進行溫度控制。"}]}];

let mcIndex=0, mcStep=0, mcSelected=null, mcAnswered=false, mcScore=0;
const cats=['全部',...Array.from(new Set(questions.map(q=>q.category)))];
function switchMode(m){mode=m;document.getElementById('quizMode').style.display=(m==='quiz'||m==='wrong')?'grid':'none';document.getElementById('megaMode').style.display=m==='mega'?'block':'none';document.getElementById('quizTab').classList.toggle('active',m==='quiz');document.getElementById('wrongTab').classList.toggle('active',m==='wrong');document.getElementById('megaTab').classList.toggle('active',m==='mega'); if(m==='wrong'){category='錯題';current=0;selected=null;answered=false;score=0;history=[];renderCats();renderQuiz();} if(m==='mega') renderMegaList();}
function baseList(){let s=(document.getElementById('search')?.value||'').trim().toLowerCase();let list=mode==='wrong'?wrongBank:(category==='全部'?questions:questions.filter(q=>q.category===category)); if(s)list=list.filter(q=>(q.stem+q.options.join(' ')+q.explanation).toLowerCase().includes(s)); if(order)list=order.map(i=>list[i]).filter(Boolean); return list;}
function renderCats(){document.getElementById('categories').innerHTML=cats.map(c=>`<button class="cat ${c===category&&mode!=='wrong'?'active':''}" onclick="switchMode('quiz');resetQuiz('${c}')">${c}</button>`).join('');}
function resetQuiz(c='全部'){category=c; current=0; selected=null; answered=false; score=0; history=[]; order=null; renderCats(); renderQuiz();}
function shuffleQuiz(){let list=baseList(); order=[...Array(list.length).keys()].sort(()=>Math.random()-0.5); current=0;selected=null;answered=false;score=0;history=[];renderQuiz();}
function updateStats(){let list=baseList();document.getElementById('score').textContent=score;document.getElementById('answered').textContent=history.length;document.getElementById('total').textContent=list.length;document.getElementById('wrongCount').textContent=wrongBank.length;let p=list.length?((current+(answered?1:0))/list.length)*100:0;document.getElementById('bar').style.width=p+'%';}
function choose(i){if(answered)return;selected=i;answered=true;const q=baseList()[current];const ok=i===q.answer;if(ok)score++;else if(!wrongBank.find(x=>x.id===q.id))wrongBank.push(q);history.push({id:q.id,correct:ok});renderQuiz();}
function nextQ(){if(current<baseList().length-1){current++;selected=null;answered=false;renderQuiz();}else renderDone();}
function renderDone(){document.getElementById('quizArea').innerHTML=`<div class="card result"><div style="font-size:48px">✅</div><h2>完成本回合練習</h2><p>分數：<b>${score} / ${baseList().length}</b></p><p>目前累積錯題：<b>${wrongBank.length}</b> 題</p><button class="btn" onclick="resetQuiz(category)">再練一次</button> <button class="btn secondary" onclick="switchMode('wrong')">練錯題</button></div>`;updateStats();}
function renderQuiz(){let list=baseList(); if(!list.length){document.getElementById('quizArea').innerHTML=`<div class="card result"><h2>目前沒有題目</h2><p>可能是搜尋條件或錯題本為空。</p></div>`;updateStats();return;} if(current>=list.length)current=0;const q=list[current];const opts=q.options.map((op,i)=>{let cls='option';if(answered&&i===q.answer)cls+=' correct';if(answered&&selected===i&&i!==q.answer)cls+=' wrong';return `<button class="${cls}" onclick="choose(${i})" ${answered?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${op}</span></button>`}).join('');let fb='';if(answered){const ok=selected===q.answer;fb=`<div class="feedback ${ok?'correct':'wrong'}"><h3>${ok?'✅ 答對了':'❌ 答錯了，請看高分詳解'}</h3><p><b>正確答案：${String.fromCharCode(65+q.answer)}</b></p><p>${q.explanation}</p><div class="actions"><button class="btn" onclick="nextQ()">${current===list.length-1?'看成績':'下一題'}</button><button class="btn secondary" onclick="resetQuiz(category)">重新開始</button></div></div>`}document.getElementById('quizArea').innerHTML=`<div class="card"><div class="quiz-head"><div class="badges"><span class="badge red">${q.category}</span><span class="badge">${q.level}</span><span class="badge">${q.id}</span><span class="badge">第 ${current+1} / ${list.length} 題</span></div><div class="stem">${q.stem}</div></div><div class="options">${opts}</div>${fb}</div>`;updateStats();}
function renderMegaList(){document.getElementById('megaArea').innerHTML=`<h2>Megacode 情境練習</h2><p class="small">每個情境會連續問你下一步，練習 ACLS 流程感。</p><div class="grid">${megacodes.map((m,i)=>`<div class="mc-card"><h3>${m.title}</h3><p>${m.intro}</p><button class="btn" onclick="startMega(${i})">開始</button></div>`).join('')}</div>`;}
function startMega(i){mcIndex=i;mcStep=0;mcSelected=null;mcAnswered=false;mcScore=0;renderMega();}
function chooseMega(i){if(mcAnswered)return;mcSelected=i;mcAnswered=true;if(i===megacodes[mcIndex].steps[mcStep].answer)mcScore++;renderMega();}
function nextMega(){if(mcStep<megacodes[mcIndex].steps.length-1){mcStep++;mcSelected=null;mcAnswered=false;renderMega();}else renderMegaDone();}
function renderMega(){const m=megacodes[mcIndex],s=m.steps[mcStep];const opts=s.options.map((op,i)=>{let cls='option';if(mcAnswered&&i===s.answer)cls+=' correct';if(mcAnswered&&mcSelected===i&&i!==s.answer)cls+=' wrong';return `<button class="${cls}" onclick="chooseMega(${i})" ${mcAnswered?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${op}</span></button>`}).join('');let fb='';if(mcAnswered){const ok=mcSelected===s.answer;fb=`<div class="feedback ${ok?'correct':'wrong'}"><h3>${ok?'✅ 正確流程':'❌ 流程需修正'}</h3><p>${s.explanation}</p><button class="btn" onclick="nextMega()">${mcStep===m.steps.length-1?'完成情境':'下一步'}</button></div>`}document.getElementById('megaArea').innerHTML=`<div class="card"><div class="quiz-head"><div class="badges"><span class="badge red">Megacode</span><span class="badge">步驟 ${mcStep+1} / ${m.steps.length}</span><span class="badge">得分 ${mcScore} / ${mcStep+(mcAnswered?1:0)}</span></div><h2>${m.title}</h2><p class="small">${m.intro}</p><div class="stem">${s.prompt}</div></div><div class="options">${opts}</div>${fb}</div><p><button class="btn secondary" onclick="renderMegaList()">回列表</button></p>`;}
function renderMegaDone(){const m=megacodes[mcIndex];document.getElementById('megaArea').innerHTML=`<div class="card result"><div style="font-size:48px">🏥</div><h2>${m.title} 完成</h2><p>本情境分數：<b>${mcScore} / ${m.steps.length}</b></p><button class="btn" onclick="startMega(${mcIndex})">再練一次</button> <button class="btn secondary" onclick="renderMegaList()">回列表</button></div>`;}
renderCats();renderQuiz();
</script>
</body></html>
