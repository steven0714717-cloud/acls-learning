*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:#f5f7fb;color:#1e293b}header{background:linear-gradient(135deg,#7f1d1d,#c2410c);color:white;padding:32px 20px}.container{max-width:1160px;margin:0 auto}h1{font-size:34px;margin:0 0 8px}.subtitle{line-height:1.7;opacity:.95}.tabs{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.tab{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.15);color:white;padding:11px 16px;border-radius:999px;cursor:pointer;font-weight:800}.tab.active{background:white;color:#7f1d1d}main{padding:24px 20px 55px}.layout{display:grid;grid-template-columns:280px 1fr;gap:22px;align-items:start}.panel,.card{background:white;border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 12px 28px rgba(15,23,42,.08)}.panel{padding:18px;position:sticky;top:12px}.panel h2{font-size:18px;margin:0 0 12px}button{font-family:inherit}.cat{width:100%;border:1px solid #cbd5e1;background:white;text-align:left;padding:10px 12px;border-radius:13px;margin:4px 0;cursor:pointer;color:#334155}.cat.active{background:#7f1d1d;color:white;border-color:#7f1d1d;font-weight:800}.stat{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;padding:12px;border-radius:16px;margin-top:14px;line-height:1.6;font-size:14px}.search{width:100%;border:1px solid #cbd5e1;border-radius:13px;padding:10px;margin:7px 0 12px}.quiz-head{padding:24px 26px;border-bottom:1px solid #e2e8f0}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#f1f5f9;font-size:13px;font-weight:800;color:#475569}.badge.red{background:#fee2e2;color:#991b1b}.stem{font-size:21px;line-height:1.65;font-weight:800;white-space:pre-wrap}.options{padding:22px 26px;background:#f8fafc}.option{width:100%;display:flex;gap:12px;text-align:left;background:white;border:2px solid #e2e8f0;border-radius:17px;padding:15px;margin-bottom:11px;font-size:16px;line-height:1.55;cursor:pointer;transition:.15s}.option:hover{border-color:#94a3b8}.letter{width:29px;height:29px;border-radius:50%;background:#e2e8f0;display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto}.option.correct{background:#ecfdf5;border-color:#16a34a}.option.wrong{background:#fef2f2;border-color:#dc2626}.feedback{padding:22px 26px;border-top:1px solid #e2e8f0}.feedback.correct{background:#ecfdf5}.feedback.wrong{background:#fef2f2}.feedback h3{margin:0 0 10px;font-size:20px}.feedback p{margin:0 0 15px;line-height:1.8;white-space:pre-wrap}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #7f1d1d;background:#7f1d1d;color:white;border-radius:13px;padding:11px 16px;cursor:pointer;font-weight:800}.btn.secondary{background:white;color:#334155;border-color:#cbd5e1}.btn:disabled{opacity:.45;cursor:not-allowed}.progress-wrap{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:12px}.bar{height:100%;background:#7f1d1d;width:0%;transition:.2s}.result{padding:34px;text-align:center}.result h2{font-size:28px;margin:8px 0}.grid{display:grid;gap:14px}.mc-card{padding:20px;border-radius:20px;border:1px solid #e2e8f0;background:white;box-shadow:0 8px 20px rgba(15,23,42,.06)}.mc-card h3{margin:0 0 8px}.small{font-size:14px;color:#64748b;line-height:1.7}footer{margin-top:24px;color:#64748b;font-size:13px;line-height:1.7}@media(max-width:860px){.layout{grid-template-columns:1fr}.panel{position:static}h1{font-size:28px}.stem{font-size:19px}}

<body>
<header><div class="container"><h1>ACLS 完整高分版題庫＋Megacode</h1><div class="subtitle">整合你提供的 D 卷照片題庫與上傳 PDF 題庫。包含分類練習、搜尋、即時詳解、錯題重練、隨機出題與 Megacode 情境流程。</div><div class="tabs"><button class="tab active" id="quizTab" onclick="switchMode('quiz')">選擇題模式</button><button class="tab" id="wrongTab" onclick="switchMode('wrong')">錯題重練</button><button class="tab" id="megaTab" onclick="switchMode('mega')">Megacode 模式</button></div></div></header>
<main>
<div class="container layout" id="quizMode"><aside class="panel"><h2>分類與功能</h2><input class="search" id="search" placeholder="搜尋題目關鍵字，如 VF、Atropine、STEMI" oninput="resetQuiz(category)"><div id="categories"></div><div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="shuffleQuiz()">隨機出題</button><button class="btn secondary" onclick="resetQuiz('全部')">重設</button></div><div class="stat"><div><b>分數：</b><span id="score">0</span> / <span id="answered">0</span></div><div><b>目前題數：</b><span id="total"></span> 題</div><div><b>錯題：</b><span id="wrongCount">0</span> 題</div><div class="progress-wrap"><div class="bar" id="bar"></div></div></div><div class="stat"><b>高分提醒：</b><br>VF/pVT：電擊＋CPR；PEA/Asystole：CPR＋Epi＋找5H5T；不穩定tachy：同步整流；不穩定brady：Atropine/TCP/升壓輸注。</div></aside><section id="quizArea"></section></div>
<div class="container" id="megaMode" style="display:none"><section id="megaArea"></section></div>
<footer class="container">註：部分 PDF 原題含心電圖圖片；本版已保留題幹文字與答案詳解，但心電圖細節建議搭配原 PDF 或課堂投影片複習。本工具為學習輔助，不取代正式 ACLS 課程與臨床決策。</footer>
</main>
<script>
const questions = [{"id": "D01", "category": "照片題庫 D卷", "level": "核心", "stem": "依據 AHA ACLS 心臟停止處置流程，下列處置何者錯誤？", "options": ["VF/pVT 為可電擊心律，應優先去顫電擊，電擊後馬上 CPR 兩分鐘", "雙相去顫電擊建議初始劑量不論廠牌皆固定為 200J", "Lidocaine 可用於 VF/pVT 電擊後給藥，初劑量 1–1.5 mg/kg IV", "Amiodarone 可用於 VF/pVT 電擊後給藥，初劑量 300 mg IV/IO push"], "answer": 1, "explanation": "雙相去顫能量應依廠牌建議，常見範圍約 120–200J；若不知道機型建議值，才常用最大可用能量。"}, {"id": "D02", "category": "照片題庫 D卷", "level": "基礎", "stem": "目擊病人倒地，確認無反應後，後續處置步驟何者正確？", "options": ["立即打開呼吸道，無呼吸給呼吸，無脈搏給胸部按壓，再求救", "立即求救、打電話及取得 AED，儘快同時評估呼吸及脈搏；若無呼吸及無脈搏，先胸外按壓，再打開呼吸道給氧", "先求救，再評估無呼吸後給予呼吸，再評估無脈搏後給予胸部按壓", "先求救，再評估無脈搏後給予胸部按壓，再評估無呼吸後給予呼吸"], "answer": 1, "explanation": "BLS 強調確認無反應後立即啟動緊急反應系統並取得 AED；醫療人員可同時快速評估呼吸與脈搏，無脈搏或高度懷疑心跳停止即開始 C-A-B。"}, {"id": "D03", "category": "照片題庫 D卷", "level": "基礎", "stem": "欲救回猝死病人，下列何者最重要？", "options": ["早期求救及 CPR", "早期電擊", "完整生命之鏈，即完整的緊急醫療救護 EMS 體系", "早期高級救命術"], "answer": 0, "explanation": "提升存活率需要完整生命之鏈，但考試重點常強調早期求救及早期 CPR 是啟動後續救命流程的基礎。"}, {"id": "D04", "category": "照片題庫 D卷", "level": "核心", "stem": "PEA 經 CPR 兩分鐘後，變成可電擊心律 VF/pVT，後續處置何者錯誤？", "options": ["應優先去顫電擊，電擊後馬上 CPR 兩分鐘", "此情境下需待去顫電擊兩次後，才進行給藥，給予 Epinephrine", "雙相電擊器依不同廠牌建議，去顫電擊初始劑量約 120–200J", "若 PEA 時已給予 Epinephrine，電擊後可立即給予 Amiodarone 300 mg IV"], "answer": 3, "explanation": "轉為 VF/pVT 後應立即去顫並恢復 CPR。Amiodarone 通常用於持續或反覆 VF/pVT，常在多次電擊與 epinephrine 後考慮。"}, {"id": "D05", "category": "照片題庫 D卷", "level": "進階", "stem": "關於復甦後照護流程，下列何者錯誤？", "options": ["首先應維持 ABC，必要時進行氣管插管，維持呼吸血氧及循環血壓", "儘快完成 12 導程 EKG，判斷是否為 STEMI，會診心臟科進行 PCI", "意識不清者，維持目標溫度管理至少 24 小時以上，儘快進入加護病房", "復甦後意識不清病人，進行目標體溫管理 TTM，維持低溫 30–32°C"], "answer": 3, "explanation": "ROSC 後不建議低到 30–32°C。重點是避免發燒、維持氧合通氣、血壓灌流、12導程 ECG 與神經保護。"}, {"id": "D06", "category": "照片題庫 D卷", "level": "基礎", "stem": "馬路上目擊老先生倒地失去反應，下列何者優先？", "options": ["啟動緊急應變系統", "確認現場環境安全", "開始高品質 CPR，從壓胸開始", "開始復甦呼吸"], "answer": 1, "explanation": "所有急救第一步是確認現場安全，避免施救者也受傷。"}, {"id": "D07", "category": "照片題庫 D卷", "level": "核心", "stem": "處理心律不整病人進行同步整流時，心律突然變成 VF，此時第一優先處置為何？", "options": ["開始 CPR，並立刻插管", "給予 Epinephrine 1 mg IV push", "關掉同步鈕，改成去顫電擊", "加大整流電擊，給予第二次同步整流"], "answer": 2, "explanation": "VF 是不可同步的可電擊心律，應立即使用非同步去顫 defibrillation。"}, {"id": "D08", "category": "照片題庫 D卷", "level": "基礎", "stem": "兩位專業醫護同仁進行 CPR 時，嬰兒的壓胸與吹氣比例何者正確？", "options": ["被救者為嬰兒時，壓胸 5：吹氣 1", "被救者為嬰兒時，壓胸 30：吹氣 2", "被救者為嬰兒時，壓胸 15：吹氣 2", "被救者為兒童時，壓胸 30：吹氣 2"], "answer": 2, "explanation": "兩位醫護人員對嬰兒或兒童 CPR 時，壓胸：通氣比例為 15：2。"}, {"id": "D09", "category": "照片題庫 D卷", "level": "基礎", "stem": "用餐時有人噎到，滿臉通紅且大力咳嗽，下列處置何者錯誤？", "options": ["先密切觀察", "不應干擾他咳嗽的動作", "可以鼓勵他儘量咳、用力咳直到異物解除", "立即給予哈姆立克急救法"], "answer": 3, "explanation": "仍能大力咳嗽代表氣道未完全阻塞，應鼓勵咳嗽並觀察；哈姆立克法用於嚴重阻塞、無法說話或無效咳嗽者。"}, {"id": "D10", "category": "照片題庫 D卷", "level": "核心", "stem": "中年女性門診候診時暈倒，心電圖監視器心跳約 45 次/分，圖形顯示 P 波後間歇性掉 QRS，PR 間期固定，最可能為何？", "options": ["1° AV block", "2 度一型房室傳導阻斷 Mobitz I", "2 度二型房室傳導阻斷 Mobitz II", "3° AV block"], "answer": 2, "explanation": "Mobitz II 特色是 PR 間期固定，但突然有 P 波無法傳導到 QRS。"}, {"id": "D11", "category": "照片題庫 D卷", "level": "核心", "stem": "心搏過緩病人治療，呼吸喘且血壓低 80/60 mmHg，下列治療何者優先？", "options": ["Atropine 0.5 mg IV push", "Atropine 1 mg IV push", "Epinephrine 0.5 mg IV push", "使用經靜脈心臟節律器 TVP"], "answer": 1, "explanation": "有症狀心搏過緩的一線藥物為 atropine 1 mg IV，每 3–5 分鐘可重複，最大總量 3 mg。"}, {"id": "D12", "category": "照片題庫 D卷", "level": "核心", "stem": "病人心電圖為 2 度 1 型房室傳導阻斷 Mobitz I，無 ST 段變化，心跳 48 次/分，血壓 92/70 mmHg，下列治療何者優先？", "options": ["Atropine 1 mg IV push，若無效每 3–5 分鐘可再給，最大劑量 3 mg", "Dopamine 或 Epinephrine IV drip", "經皮節律器 TCP", "若有休克及缺血胸痛之嚴重症狀，第一優先治療為經靜脈節律器 TVP"], "answer": 0, "explanation": "Mobitz I 多位於 AV node，若合併症狀或灌流不足，可先使用 atropine。"}, {"id": "D13", "category": "照片題庫 D卷", "level": "進階", "stem": "有關成人立即復甦後照護流程，下列何者正確？", "options": ["目標體溫管理只使用在 VF 復甦後昏迷，而 Asystole/PEA 則不用", "若病人心跳停止原因是肺栓塞，不建議在復甦後給予纖維溶解劑", "機器性循環支持如 ECMO 無法改善病人的血液動力學", "復甦後的病人如果血糖過高，神經學預後較差"], "answer": 3, "explanation": "ROSC 後高血糖與較差神經預後相關，應避免明顯高血糖與低血糖。"}, {"id": "D14", "category": "照片題庫 D卷", "level": "進階", "stem": "有關嚴重低體溫併心臟停止的治療，下列何者正確？", "options": ["盡量勿放氣管內管，因怕動作太大會造成 VF", "如需電擊，只能電擊一次，然後做內在回溫", "勿給急救藥物，急救以內在回溫為主", "按一般 ACLS 原則治療，加上主動內在回溫"], "answer": 3, "explanation": "低體溫心跳停止仍需高品質 CPR、必要時除顫與 ACLS 處置，同時積極復溫。"}, {"id": "D15", "category": "照片題庫 D卷", "level": "核心", "stem": "下列何者屬於確定呼吸道 definitive airway？", "options": ["喉管 Laryngeal tube", "喉部面罩呼吸道 LMA", "外科呼吸道 Surgical airway", "食道氣管合併管 Combitube"], "answer": 2, "explanation": "確定呼吸道通常指有 cuff 的管路位於氣管內，例如氣管內管或外科呼吸道。"}, {"id": "D16", "category": "照片題庫 D卷", "level": "核心", "stem": "有關插管後確認氣管內管位置的方法，下列何者正確？", "options": ["食道偵測球 EDD 沒有膨脹，即可確認位置正確", "臨床聽診確認方法最可靠，不需其他方法再確認", "臨床加上輔助儀器雙重確認", "吐氣末二氧化碳偵測器 ETCO2 最準確，不需其他方法再確認"], "answer": 2, "explanation": "插管後需多方法確認，單一方法可能有假陽性或假陰性。"}, {"id": "D17", "category": "照片題庫 D卷", "level": "進階", "stem": "60 歲先生突發說話不清、右側手腳無力、疑似中風，以下何種情況較適合施打 rt-PA？", "options": ["家人不知道何時倒地，但 5 小時前曾看到他在客廳走動", "到院時發現血糖為 40 mg/dL", "據家人說法二個月前曾車禍有過腦部傷害", "到院時血壓 200/150 mmHg，經藥物治療降為 180/105 mmHg"], "answer": 3, "explanation": "急性缺血性中風若符合時間窗且無禁忌，血壓需控制至 <185/110 mmHg 後才可考慮 alteplase。"}, {"id": "D18", "category": "照片題庫 D卷", "level": "核心", "stem": "關於 STEMI 或 NSTE-ACS 的藥物治療，下列敘述何者錯誤？", "options": ["為減少心肌梗塞範圍及併發症，急診必須立刻給予 beta-blocker", "NSTE-ACS 應注意高危險群，需住加護病房並早期 PCI 治療", "給予雙重抗血小板藥物 Aspirin 和 P2Y12 抑制劑如 Ticagrelor 或 Clopidogrel", "STEMI 考慮 PCI 時，應於到院後 90 分鐘內進行"], "answer": 0, "explanation": "Beta-blocker 不是所有 ACS 都必須立即給，需先排除低血壓、心衰竭、心搏過慢、AV block、支氣管痙攣等禁忌。"}, {"id": "D19", "category": "照片題庫 D卷", "level": "核心", "stem": "有關心搏過速之整流治療劑量，下列何者錯誤？", "options": ["窄的、規則的 QRS：劑量為 50–100J 同步電擊", "寬的、規則的 QRS：劑量為 100J 同步電擊", "寬的、不規則的 QRS：劑量為 120–200J（雙相）或 200J（單相）非同步電擊", "寬的、不規則的 QRS：劑量為 120–200J（雙相）或 200J（單相）同步電擊"], "answer": 3, "explanation": "不規則寬 QRS 可能是 polymorphic VT、torsades 或 AF with pre-excitation；應用去顫劑量的非同步電擊。"}, {"id": "D20", "category": "照片題庫 D卷", "level": "核心", "stem": "病人突然喪失意識，血壓 70/40 mmHg，心電圖為規則寬 QRS 心搏過速，若仍有脈搏，下列處置何者正確？", "options": ["Amiodarone 300 mg IV drip 10 分鐘", "同步電擊 50J", "同步電擊 100J", "非同步電擊 150J"], "answer": 2, "explanation": "規則寬 QRS 且有脈搏但不穩定，最適當為同步整流，起始能量常用 100J。"}, {"id": "D21", "category": "照片題庫 D卷", "level": "核心", "stem": "病人心悸不適，血壓 80/60 mmHg，心電圖為規則窄 QRS 心搏過速，下列處置何者正確？", "options": ["同步電擊 150J", "可先嘗試頸動脈竇按摩等迷走神經刺激", "考慮 Adenosine 初劑量 6 mg 快速 IV push，再以 20 mL 生理食鹽水沖推", "Amiodarone 150 mg IV 10 分鐘"], "answer": 2, "explanation": "規則窄 QRS SVT 可用 adenosine 6 mg 快速推注接 20 mL NS flush；不穩定時則準備同步整流。"}, {"id": "D22", "category": "照片題庫 D卷", "level": "進階", "stem": "30 歲男性規則單型寬 QRS 心搏過速，疑似 PSVT 合併變異傳導，心跳 180/min、血壓 100/76 mmHg，下列治療何者適當？", "options": ["Adenosine 初始劑量 6 mg IV push 1–3 秒，再以 20 mL NS 沖推", "Amiodarone 300 mg IV 10 分鐘", "同步整流 100J", "同步整流，雙相波 120–200J 或單相波 200J"], "answer": 0, "explanation": "穩定、規則、單型寬 QRS tachycardia 可考慮 adenosine 作為診斷與治療。"}, {"id": "D23", "category": "照片題庫 D卷", "level": "進階", "stem": "關於 PEA 常見原因 5H5T 的找尋方法，何者錯誤？", "options": ["病史詢問很重要，特別是尿毒症或冠狀動脈心臟病等", "身體理學檢查包括眼瞼是否蒼白、瞳孔變化、頸靜脈是否怒張等", "12 導程心電圖及抽血檢驗心臟酵素", "心臟超音波可檢查心包膜填塞，其他胸部腹部超音波沒幫忙"], "answer": 3, "explanation": "POCUS 可協助評估心包填塞、張力性氣胸、低血容、右心負荷、腹腔出血等可逆原因。"}, {"id": "D24", "category": "照片題庫 D卷", "level": "核心", "stem": "老先生到院時已無脈搏及呼吸，心電圖呈現規則、無 P 波、寬 QRS 波，速率約 35/min，此病人狀況為何？", "options": ["Idioventricular rhythm", "Pulseless electrical activity", "Asystole", "Atrial fibrillation"], "answer": 1, "explanation": "只要病人無脈搏，但監視器仍有可辨識電氣活動，即為 PEA。"}, {"id": "D25", "category": "照片題庫 D卷", "level": "核心", "stem": "關於 PEA 常見且能迅速床邊診斷處置的病因 5H5T，下列何者為非？", "options": ["Hypovolemia 低血容量", "Tension pneumothorax 張力性氣胸", "Tamponade cardiac 心包填塞", "Thrombosis, pulmonary 肺栓塞"], "answer": 3, "explanation": "肺栓塞屬於 5H5T，但相較於低血容、張力性氣胸、心包填塞，通常較難在床邊迅速確診與立即處置。"}, {"id": "PDF002", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "根據以往之統計，病人發生VF 倒地後，若沒有接受CPR，也未接受去顫電擊，每過一分鐘存\n活率約下降?", "options": ["3-4%", "7-10%", "12-15%", "18-20%"], "answer": 1, "explanation": "可經由電擊救回來的心律(VF 及pulseless VT)，若延遲1 分鐘不做CPR，電擊救回來的\n機率會減少7-10%，如有做CPR 每晚一分鐘才做電擊，平均存活率減少3-4%，因此，對於可\n電擊之心率，應儘早給於電擊，並把握時間做壓胸動作。"}, {"id": "PDF003", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "在醫院外發生心跳停止的病人，所謂早期電擊是指病人倒地後，盡可能在幾分鐘內給予使用自\n動電擊器，對於心跳停止病人有較好的預後?", "options": ["3 分鐘", "5 分鐘", "6 分鐘", "10 分鐘"], "answer": 1, "explanation": "可電擊的心臟驟停病人越早電擊治療，將有越好的預後，當病人在倒地後3 至5 分鐘內\n做CPR 加上去顫存活率可達49%至75%；考慮到腦部細胞在心跳停止後4-6 分鐘就開始損傷，\n依院內外設備和人力的不同，使用電擊器的目標，建議為院內3 分鐘內，院外5 分鐘內。"}, {"id": "PDF004", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "專業人員面對無意識的病人，檢查脈搏時間不應該超過？", "options": ["3 秒", "5 秒", "10 秒", "1 分鐘"], "answer": 2, "explanation": "檢查脈搏時間為不超過10 秒，當判斷無脈搏時即應開始CPR \n \n \n---PAGE 3---\n2026.01 \n3 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF005", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "關於成人高品質胸部按壓的描述，下列敘述何者正確?", "options": ["以4 公分深度無干擾的按壓", "胸部按壓但不須通氣", "按壓速率低於 100 次/分鐘或高於120 次/分鐘", "須讓胸部完全回彈"], "answer": 3, "explanation": "根據2025 AHA Guidelines Update for CPR and ECC 強調包括 \n⮚ 壓夠快：100-120 次/分鐘的按壓速率。 \n⮚ 壓夠深：成人按壓深度至少為 2 英吋 (5 公分)；嬰兒和兒童按壓深度至少達胸廓前後徑 \n 尺寸的三分之一(嬰兒約為1.5 英吋[4 公分]，兒童約為2 英吋[5 公分])。 \n⮚ 胸回彈：只ACLS 強調CPR 間，不要靠在病人身上，在壓完30 下後掌根要離胸， \n 以確保每次按壓後確保胸部的完全回彈 \n⮚ 莫中斷：儘量避免中斷胸部按壓的動作及將中斷的時間控制在 10 秒內，提高胸部按壓 \n 時間的比率，目標為至少60%。"}, {"id": "PDF007", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "體外心臟按摩所造成的心輸出量為正常情形時的多少?", "options": ["10-20%", "25-33%", "37-40%", "46-50%"], "answer": 1, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF008", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "由施救者口中吹氣，其氧濃度為多少?", "options": ["25%", "22%", "17%", "13%"], "answer": 2, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF009", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "有關2025 年美國心臟協會ACLS 之復甦指導原則，何者錯誤?", "options": ["OHCA 成人生命之鏈，強調儘早CPR：先做胸部按壓並進行快速去顫", "Sudden Cardiac Arrest(突然心跳停止)之診斷重點是：無反應和無呼吸或僅有喘息 \n 的組合", "急救時設置高級呼吸道後，配合持續胸部按壓，每分鐘要給8 次的吹氣", "以量化潮氣末二氧化碳(PETCO2)濃度監測CPR 品質時，若小於10mmHg，需嘗試改善 \n CPR 品質"], "answer": 2, "explanation": "放置進階呼吸道後，施救者不需要再施予30：2 的CPR。直接給予持續的胸部按壓(不\n需因呼吸而暫停)，每分鐘給予10 次之吹氣。"}, {"id": "PDF010", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "根據2025 年版ACLS，針對院外心臟停止研究結果，有關建議透過智慧型手機之急救相關應\n用程式或簡訊呼叫求救，下列何者正確?", "options": ["可縮短旁人反應時間、增加旁人施救率", "可縮短電擊時間", "增加出院存活率", "以上皆是"], "answer": 3, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF011", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "2025 年版ACLS，針對提高CPR 品質研究結果之建議，下列何者正確?", "options": ["使用視聽回饋設備監測，可以提升急救品質", "當CPR 時使用連續監測的動脈血壓和ETCO2，可以促進急救品質", "再次強調胸部按壓質量的重要性", "以上皆是"], "answer": 3, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF012", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "有關2025 年版生存之鏈之敘述，下列何者正確?", "options": ["對於心跳停止倖存者而言，透過整合式照護系統，在出院前進行評估、出院後持續追蹤並\n定期處理需求，可改善康復過程及長期功能性預後。", "第六環係指對心臟停止救回者在出院前，提供身體、神經、心肺和認知失能多方面的 \n評估", "第六環也建議連同其照護者，包含醫療與復健治療之全方位及多方面的出院計畫、 \n以便回到工作崗位上", "對大多數 OHCA 的成人和兒童而言，若無特殊情形，優先進行現場復甦對於ROSC 有更\n佳效果。"], "answer": 3, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF013", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "有關CPR 之描述，下列何者錯誤 ?", "options": ["不論一或二人，操作成人循環式CPR，壓、吹比均為30：2", "應連續作五個循環，或每2 分鐘檢查一次心律", "非醫療專業施救者，只要看起來是瀕死的喘息(agonal gasps)、高度懷疑心跳停止時就需\nCPR", "人工呼吸吹氣時最好深吸一口氣再吹"], "answer": 3, "explanation": "CPR 2025 年最新版成人循環式CPR，不論1 人或2 人壓、吹比均為30：2。而對小兒\nCPR 時，非醫療專業施救者不論1 人或2 人壓、吹比均為30：2，但醫護人員2 人對小兒CPR\n時，壓、吹比改為15：2。CPR 五個循環約2 分鐘後檢查一次心律，若心律改變時再檢查脈搏。\n非醫療專業施救者只要看到瀕死的喘息，不論是否還有脈搏，就需CPR。進行人呼吸吹氣時，\n應同時注意胸部是否有起伏，等胸部完全落下再吹第二口氣，每一口氣為大於1 秒鐘。吹氣時\n不用先深吸一口氣再吹，病患不須過量氧氣，也可避免施救者因過度換氣而頭暈。 \n \n \n \n---PAGE 5---\n2026.01 \n5 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF014", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "當執行完CPR 五個循環後若心律改變，經評估脈搏己恢復，但仍無呼吸時，尚未建立高級呼\n吸道，下列何者正確?", "options": ["快速連續給氣，每口1 秒鐘", "維持每分鐘10 次/分，約每隔6 秒給一口氣", "擺復甦姿勢", "以上皆是"], "answer": 1, "explanation": "執行完CPR 五個循環後己恢復脈搏，但是卻無呼吸時，2025 年更新建議不管有無進階\n呼吸道，每分鐘10 次/分的人工呼吸，每6 秒鐘一口氣，然後每2 分鐘後再次評估循環現象， \n若無循環現象則再次進行胸部按壓。復甦姿勢則是脈搏及呼吸皆恢復時等待救援的姿勢。"}, {"id": "PDF015", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "下列描述，何者正確?", "options": ["有關CPR，壓胸位置為胸部中央，壓胸深度為至少2 吋", "若有插管，壓胸與呼吸則各自獨立執行，不須維持30：2", "按壓時可每兩分鐘換手一次，避免施救者耗竭", "以上皆是"], "answer": 3, "explanation": "為使非醫療專業人員急救時快速尋找按壓位置，新的按壓位置是胸部的中央，若已經有\n進階呼吸道置入如插管，則不用做循環式的CPR，各自維持壓胸100-120 次/分及呼吸速率10\n次/分。"}, {"id": "PDF016", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "只有單一施救者，且無法立即撥打求救電話/取得AED 時，下列何種情境建議先做約2 分鐘CPR\n再離開求援/取AED？", "options": ["無反應的嬰兒或兒童（單獨一人、無法立即求救）", "目擊成人突然倒地（應先啟動求救並取AED）", "身旁已有AED 可立即取得", "以上皆是"], "answer": 0, "explanation": "AHA 建議：單一施救者遇到嬰兒/兒童心跳停止且無法立即求救時，先進行約2 分鐘CPR\n再離開求援/取AED；成人目擊倒地則應先啟動緊急救護系統並取AED 後立刻開始CPR。"}, {"id": "PDF017", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "CPR 急救時 ， 病人已插置氣管內管，可暫時停止胸部按壓的時機是?", "options": ["電擊器充電時", "檢查心律時", "給予正壓呼吸時", "給Epinephrine IV push 時"], "answer": 1, "explanation": "CPR 已有進階呼吸道時，除檢查心律要暫停胸部按壓外，其餘時機要不間斷的胸部按壓。"}, {"id": "PDF018", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "醫療上及法律上接受，終止CPR 的時機是?", "options": ["CPR 30 分鐘後仍無效", "瞳孔對光無反應", "當對腦部是否完全恢復有疑問時", "在經過BLS 及ACLS 之努力，仍無適當反應時"], "answer": 3, "explanation": "終止CPR 的時機沒有一定的準則，也沒有時間上的標準，要考慮民情及社會大眾；目\n前可接受的是經過CPR 和ACLS 努力後仍無反應時，與家屬溝通也達成共識，就終止吧。"}, {"id": "PDF019", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "孩童心跳停止(cardiac arrest)之主要原因為？", "options": ["致命性心律不整", "心肌梗塞", "心臟瓣膜疾病", "呼吸停止後之缺氧"], "answer": 3, "explanation": "孩童心跳停止之常見原因為呼吸停止，所以若只有一名施救者且孤立無援時要先對孩童\n做5 個循環的CPR 再求援。"}, {"id": "PDF020", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "CPR 按壓速率為每分鐘100 - 120 次。設立按壓速率上限係依據一項大型臨床研究分析，發現\n過快的按壓速率會導致下列那一項?", "options": ["施救者容易疲勞", "按壓深度不足", "張力性氣胸", "肋骨骨折"], "answer": 1, "explanation": "最低建議按壓速率仍為每分鐘 100 次。加入每分鐘120 次的速率上限因為 1 項大型，\n記錄系列案例顯示，按壓速率超過每分鐘 120 次時，按壓深度會以速率相依方式縮小。例如，\n按壓速率每分鐘 100 到 119 次時，按壓深度不當的比例約為 35%，但按壓速率為每分鐘120 \n到 139 次時，按壓深度不當會增加到 50%，按壓速率超過每分鐘 140 次時，按壓深度不當\n會達到 70%。"}, {"id": "PDF021", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "CPR 人工呼吸時，您嘗試吹氣後患者胸部沒有起伏，下列何者不能解釋此種現象？", "options": ["未正確打開患者呼吸道", "口對口吹氣時有漏氣發生", "患者口中有異物阻塞", "沒有起伏是正常的，不必在意"], "answer": 3, "explanation": "當CPR 做人工呼吸時，胸部沒有起伏，應考慮以下幾點1.未正確打開患者呼吸道2.口\n對口吹氣時有漏氣發生3.患者口中有異物阻塞。"}, {"id": "PDF022", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "下列敘述，是對已有高級呼吸道裝置病人，提供成人高品質CPR 的最佳策略?", "options": ["兩位施救者(通氣與胸部按壓)需每分鐘交換位置", "提供以30：2 比例的胸部按壓及通氣", "在胸部按壓停頓時，提供每6 秒一次的兩次通氣", "提供沒有停頓的持續性胸部按壓、及每分鐘10 次通氣"], "answer": 3, "explanation": "當高級呼吸道建立之後，就不需要再區分胸部按壓的循環。應以每分鐘100-120 下的速\n度不間斷進行。另一方面則給予每分鐘10 次的通氣。 \n兩位施救者(通氣與胸部按壓)需每兩分鐘交換位置，以防止胸部按壓的疲倦，保持胸部按壓的\n速率與品質。 \n---PAGE 7---\n2026.01 \n7 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF023", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "在成人高品質CPR 中，下列何者可幫助減少胸部按壓的干擾?", "options": ["只在通氣時給予藥物", "在電擊後立即檢查脈搏", "在電擊器充電時，繼續按壓", "當手動去顫器到達時，繼續使用AED"], "answer": 2, "explanation": "關於ACLS 對無脈性心律的處理策略是在給予有效電擊的狀況下，儘可能的減少胸部按\n壓暫停時間。電擊後立刻檢查脈搏及心律已不被建議，而是電擊後立即作 5 個循環的CPR，\nCPR 後再檢查心律。理想狀況下，胸部按壓只在檢查心律、電擊及無插管時之人工呼吸暫停。"}, {"id": "PDF024", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "下列關於有效成人高品質CPR 特徵，下列描述何者為非?", "options": ["若體力尚可，不須每兩分鐘換手。", "使用量化波形ETCO2 監測時：PETCO2 持續低於10 mmHg 常提示灌流/壓胸品質需改善；\n數值受通氣與病因影響（較高值通常代表較佳灌流）。", "急救後出現脈搏和血壓 (ROSC)", "動脈內舒張壓大於20 毫米汞柱(mmHg)"], "answer": 0, "explanation": "使用量化波形ETCO2 監測時，若PETCO2 持續<10 mmHg，應嘗試改善壓胸品質與通\n氣；成人高品質CPR 常見生理指標包含：動脈內舒張壓≥20 mmHg、出現ROSC（有脈搏與血\n壓）、以及PETCO2 突然且持續上升（常見≥40 mmHg 提示ROSC）。每2 分鐘建議輪替壓胸者\n以避免疲乏。"}, {"id": "PDF025", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "在成人高品質CPR 的BLS 守則中，下列何者可改進胸部按壓品質?", "options": ["按壓深度越深效果越好", "每兩分鐘(5 個週期)胸部按壓後，交換CPR 提供者", "按壓胸骨上半部，並予每分鐘100-120 次按壓", "不建議每次按壓後胸部完全回彈，以確保按胸深度"], "answer": 1, "explanation": "建議的胸部按壓速率為每分鐘100-120 次。成人胸部按壓深度，建議至少2 英吋(5 cm)\n但不超過2.4 英吋(6 cm)。兩位施救者(通氣與胸部按壓 )需每兩分鐘交換位置，以防止胸部按\n壓的疲倦，保持胸部按壓的速率與品質。壓胸的位置建議在胸骨下半段。"}, {"id": "PDF026", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "張老太太，75 歲女性，本身有糖尿病、高血壓及心臟病史。她的兒子回家後見到病人沒有反應、\n打119 求救之後便開始進行CPR。若您是緊急救護員(EMT)，在病人倒下後8 分鐘到達現場， \n請問您第一件事要做什麼？", "options": ["建立進階呼吸道(Advanced airway)", "先做五個循環胸部按壓再接上自動體外除顫器(AED)查看是否可以去顫", "趕快把病患移上救護車，送到醫院急救", "最短時間內接上自動體外除顫器(AED)查看是否可以去顫"], "answer": 3, "explanation": "根據心搏停止流程，CPR 後需盡快以AED 或心電圖監視器判讀心律看是否可以去顫電\n擊，去顫後盡快恢復CPR。 \n \n \n \n---PAGE 8---\n2026.01 \n8 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF027", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "有關CPR 對於治療心室纖維顫動(VF)病人之敘述，何者有誤？", "options": ["去顫開始時間，和目擊者開始CPR 時間，與VF 病人存活率相關", "如果目擊者能立即CPR，許多VF 的成人可能存活而無神經功能障礙，尤其是在Sudden \ncardiac arrest 發生5 分鐘內進行去顫者", "CPR 能延長VF 持續時間(即延長去顫到心搏停止之時間)，並為心臟和腦提供少量攜帶氧\n和養分的血流", "單獨執行CPR，可以消除大多數VF 並恢復灌注心律"], "answer": 3, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF028", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "有關AED 自動去顫器的使用，下列敘述何者正確？", "options": ["電擊板放在胸部任何位置，其電擊時效果都是一樣的。", "若病患胸前有使用藥品貼片，電擊時不需要避免接觸到貼片。", "去顫時為搶救生命，應儘快電擊，不須確認是否人員接觸病人。", "溺水病患，若需要電擊時，應將病患胸前的水擦乾再電擊。"], "answer": 3, "explanation": "電極板Sternum 應放在右鎖骨中線接近胸骨柄(右心房)，Apex 應放在左側乳頭下接近前\n腋中線處(心尖)，對應心臟電氣傳導的方向，電擊前要移除藥物貼布，減少電阻，拭乾胸部的\n水分，避免水分導電分散電流。"}, {"id": "PDF029", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "AED 的操作有四項共通的流程(Universal AED common steps)如下，請問其正確先後順序為何？ \n1.分析心律 2.貼上電擊片 3.按下電擊按鈕 4.打開電源", "options": ["4 1 2 3", "4 2 1 3", "2 1 4 3", "2 4 1 3"], "answer": 1, "explanation": "AED 的使用步驟為 打開電源→貼上電極片→分析心律→按下電擊按鈕。"}, {"id": "PDF030", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "根據BLS 的通用流程，一位男性在遊樂場內突發性倒地，您協助幫忙急救，並使用AED 分析\n心律，AED 指示要電擊，在給過1 次電擊之後，病人沒有反應。下一步應如何處置？", "options": ["讓AED 再分析一次心律", "立刻給予5 個30：2 循環之CPR，然後再評估脈搏", "立刻給予30：2 循環之CPR，兩分鐘後AED 自動會再次分析心律", "移除AED，然後立刻給予持續之CPR，直到救護人員到達"], "answer": 2, "explanation": "AED 電擊完，應立即給予壓胸30：2 循環之CPR，兩分鐘後AED 會自動再分析心律。"}, {"id": "PDF031", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "您將AED 連接到一位43 歲，沒有呼吸沒有脈搏的病人。AED 的指令是「不需要電擊」。此時\n您應如何處置？", "options": ["立即重新啟動AED，再次分析心律，以避免誤判", "立即給予2 分鐘或5 個循環之CPR，然後讓AED 重新分析心律", "停止CPR，擺復甦姿勢，等待急救人員(EMT)到達", "解除AED，繼續CPR，等待急救人員(EMT)到達 \n---PAGE 9---\n2026.01 \n9 \n中華急救教育推廣協會ACLS 練習題"], "answer": 1, "explanation": "心搏停止流程中，針對不須電擊的心律需盡快恢復CPR2 分鐘後，再以心電圖監視器或\nAED 判讀心律是否需要去顫。"}, {"id": "PDF032", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "關於AED，下列何者為誤？", "options": ["找不到適當電擊貼片時，大人電擊貼片可用在小孩身上", "電擊後應檢測脈搏，確認有無ROSC", "電擊及機器分析心率時，不應接觸病患", "電擊完後，繼續CPR 2 分鐘，再評估心律"], "answer": 1, "explanation": "電擊後應持續CPR 2 分鐘，直到AED 提示是否可電擊，如果提示不可電擊，應立即檢\n測脈搏，確認有無ROSC。"}, {"id": "PDF033", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "下列關於AED 使用上的相關敘述，下列何者為是？", "options": ["若病患無反應但呈現瀕死的呼吸(Agonal gasps) 則AED 不能使用", "如病患裝置有心臟植入物，則AED 貼片仍可貼在植入物相對胸口位置上", "如病患的心臟內電擊器(ICD)正在產生電擊的過程(病患胸前肌肉有類似體外電擊的收縮動\n作)，則應等30 至60 秒後待ICD 完成電擊後再放置AED 貼片", "1-8 歲兒童應使用兒童用AED 貼片及兒童電擊劑量AED，但若無法取得則也不應使用 \n成人型AED"], "answer": 2, "explanation": "AED 是使用在無意識無脈搏無呼吸(或者無正常呼吸)的病患上，AED 貼片位置需避免\n放在心臟植入物上方，1-8 歲兒童如無法取得兒童AED，可使用成人型AED。"}, {"id": "PDF034", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "65 歲路倒男性，無意識、呼吸、脈搏，CPR 2 分鐘後AED 抵達分析心律建議電擊，以下何者\n為對？", "options": ["繼續CPR，CPR 滿2 分鐘後電擊一次", "電擊三次後立刻CPR", "電擊一次後立刻CPR", "電擊一次後檢查脈搏"], "answer": 2, "explanation": "AED 電擊一次後立刻CPR，兩分鐘後再讓AED 判讀心律。 \n \n呼吸道異物阻塞"}, {"id": "PDF035", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "對於一呼吸道異物完全阻塞之病患進行急救，若病人己意識喪失，下列處置何者有誤？", "options": ["應立即跨跪於病人兩大腿的上方，進行腹部按壓之哈姆立克法", "施救者應執行CPR 之步驟，並維持壓胸及吹氣30：2 之次數比", "於壓胸後，打開呼吸道動作時可同時檢查口中有無異物，再試著吹氣", "經研究顯示，壓胸比壓腹更能讓呼吸道產生更高的壓力"], "answer": 0, "explanation": "輕微呼吸道阻塞處置原則鼓勵盡量咳嗽，哈姆立克法是用在有意識且嚴重呼吸道阻塞的\n病人，可重複執行至異物排出或是意識喪失為止。當進展到無法發出聲音且臉部面色發紺，並\n意識喪失，表示為嚴重呼吸道阻塞，此時處置原則為讓患者呈現平躺姿勢進行胸部按壓及呼吸\n---PAGE 10---\n2026.01 \n10 \n中華急救教育推廣協會ACLS 練習題 \n(執行BLS 的步驟)，並在壓胸後，可嘗試看看口中有無異物；壓胸比壓腹更能讓呼吸道產生更\n高的壓力將呼吸道異物排出。"}, {"id": "PDF036", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "下列何者並非嚴重呼吸道阻塞的可能症狀？", "options": ["無法呼吸", "發紺", "意識逐漸昏迷", "大聲咳嗽"], "answer": 3, "explanation": "嚴重呼吸道阻塞症狀包含無法呼吸、發紺與意識改變。不包含患者仍可大聲咳嗽。"}, {"id": "PDF037", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "當一個人倒地不起，執行叫叫CAB，壓胸30 次後給予人工呼吸，卻發現吹氣後胸部沒有起伏，\n應考慮作何動作？", "options": ["再打開一次呼吸道，予以吹第二口氣", "檢查有無異物堵塞", "開始作哈姆立克急救術", "放棄吹氣，開始作心臟按摩"], "answer": 0, "explanation": "做BLS 時，評估吹氣是否有效以胸部起伏為準，當吹氣後胸部沒有起伏時，最常見的\n情況是呼吸道沒有被打開，此時應該重新打道呼吸道再嘗試吹氣，若有漏氣也會造成胸部沒有\n起伏。"}, {"id": "PDF038", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "對於有意識的呼吸道阻塞病人，適當之處理步驟為何？", "options": ["若仍可以呼吸、咳嗽時，鼓勵患者用力咳嗽", "若無法呼吸、說話時，立刻開始 5 次背部拍擊 + 5 次腹部推擠（反覆循環）*", "應持續做到阻塞解除或意識昏迷為止", "以上皆是"], "answer": 3, "explanation": "呼吸道異物阻塞：若仍可有效咳嗽則鼓勵咳嗽；若為嚴重阻塞且意識清醒，採用反覆循\n環的「5 次背部拍擊 + 5 次腹部推擠」，直到異物排出或轉為無反應；若病人轉為無反應，立\n即改為CPR（先壓胸），並於每次打開呼吸道嘗試給氣前檢查口內是否有可見異物。*末期懷孕\n或無法環抱腹部者，改為5 次胸部推擠(chest thrusts)。"}, {"id": "PDF039", "category": "BLS / AED / 異物阻塞", "level": "核心", "stem": "肚子很大的成人呼吸道異物完全梗塞病患(如嚴重肥胖及末期懷孕)，應如何處理？", "options": ["儘量鼓勵病人咳嗽", "以胸部推擠(chest thrusts)替代腹部推擠（末期懷孕/嚴重肥胖等）", "執行平躺式腹部按壓", "以上皆非"], "answer": 1, "explanation": "對於輕微阻塞鼓勵咳嗽；對於嚴重阻塞且意識清醒者，原則為5 次背部拍擊＋5 次腹部\n推擠反覆循環；若末期懷孕或施救者無法環抱腹部，改以胸部推擠(chest thrusts)取代腹部推擠，\n直到異物排出或病人轉為無反應。 \n \n \n \n---PAGE 11---\n2026.01 \n11 \n中華急救教育推廣協會ACLS 練習題 \n呼吸道(Airway)與呼吸(Breathing)"}, {"id": "PDF040", "category": "Airway / Breathing", "level": "核心", "stem": "有關Bag-Valve-Mask (袋-瓣-罩)的敘述，下列何者錯誤?", "options": ["使用於成人時，其潮氣容積量約為500-600ml", "在呼吸道確切建立後，仍需配合壓胸給予通氣", "過度換氣會增加胸内的壓力，減少回心血流，反而不利CPR 的結果", "在CPR 未建立進階呼吸道時，以30:2 的比例進行壓胸及吹氣"], "answer": 1, "explanation": "在進階呼吸道建立後，壓胸者以每分鐘100-120 下的速度進行壓胸，吹氣者則以每分鐘\n十次的頻率吹氣，兩者獨立進行，不須配合。"}, {"id": "PDF041", "category": "Airway / Breathing", "level": "核心", "stem": "心臟停止病患，當要放置氣管内管時，不建議中斷胸部接壓多久時間?", "options": ["10 秒", "25 秒", "45 秒", "30 秒。"], "answer": 0, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF042", "category": "Airway / Breathing", "level": "核心", "stem": "成人置放氣管内管時，適當的深度應該是前牙位於管子的那一刻度?", "options": ["14-20cm", "19-23 cm", "20-24 cm", "15-19 cm"], "answer": 1, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF043", "category": "Airway / Breathing", "level": "核心", "stem": "執行抽吸管抽吸時，其時間不應超過?", "options": ["6 秒", "15 秒", "30 秒", "40 秒"], "answer": 1, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF044", "category": "Airway / Breathing", "level": "核心", "stem": "使用BVM 時，其理想的潮氣量約為多少?", "options": ["200-300 ml", "500-600 ml", "700-900 ml", "800-1000 ml"], "answer": 1, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF045", "category": "Airway / Breathing", "level": "核心", "stem": "有關急救呼吸 (Rescue breathing)之提供次數(病人已有ROSC)，下列描述何者錯誤？", "options": ["沒有氣管內管，使用袋瓣罩裝置吹氣時大人為10 -12 次/分", "已插上氣管內管時，大人為10 次/分", "已插上氣管內管時，小孩為12 -20 次/分", "沒有氣管內管，使用袋瓣罩裝置吹氣時小孩為20-30 次/分"], "answer": 2, "explanation": "沒有氣管內管，使用袋瓣罩裝置吹氣時大人為10 -12 次/分；已插上氣管內時，大人急\n救呼吸次數為10 次/分。 \n2020 年ACLS，若嬰兒和兒童有脈搏但沒有呼吸或呼吸不正常，每2-3 秒進行 1 次人工呼吸 \n(20-30 次/分) 是合理的，直到病人恢復自主呼吸為止。(舊版則為每分鐘約12-20 次/分)。對\n已置入高級呼吸道的嬰兒和兒童施行CPR 時，根據年齡以及臨床病症，呼吸速率目標設定為\n每2 – 3sec 通氣1 次(20- 30/分鐘)是合理的。(舊版則為每分鐘約10 次/分鐘)"}, {"id": "PDF046", "category": "Airway / Breathing", "level": "核心", "stem": "簡單型氧氣面罩以6-10L/min 流速給予氧氣，可提供多少濃度?", "options": ["20-40%", "40-60%", "60-80%", "80-100%"], "answer": 1, "explanation": "簡單型氧氣面罩提供的氧氣無法再次循環收集後讓病人吸入，所以提供的濃度無法太高，\n但比鼻管的氧氣提供要好些，以6-10L/min 流速給予氧氣的話，約可提供40-60%的氧氣。"}, {"id": "PDF047", "category": "Airway / Breathing", "level": "核心", "stem": "使用鼻導管給予氧氣時，當氧氣流量為 4 L/min，則所給予的氧氣濃度約為?", "options": ["28 %", "32 %", "36 %", "40 %"], "answer": 2, "explanation": "大氣氧氣濃度約20%，使用鼻管給予氧氣，每增加1 L/min 流量氧氣濃度增加4%， \n 20+(4*4)=36。"}, {"id": "PDF048", "category": "Airway / Breathing", "level": "核心", "stem": "有關鼻咽呼吸道的使用，下列何者不正確 ?", "options": ["僅可用於昏迷之病人", "尺寸選擇為鼻孔至耳垂之長度", "顏面創傷或顱底骨折病患應避免使用", "可用於仍有嘔吐反射的病人"], "answer": 0, "explanation": "鼻咽呼吸道可用於半昏迷或仍有咳嗽及嘔吐反射的病人，較少剌激性，完全昏迷的病人\n牙關緊閉時亦可使用。 \n \n \n \n \n \n---PAGE 13---\n2026.01 \n13 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF049", "category": "Airway / Breathing", "level": "核心", "stem": "您正在處置一位休克及深度昏迷之創傷病人，下列哪一種氣道最適合該病人？", "options": ["氣管內管 (endotracheal tube)", "觀察即可，暫不須氣道維持", "鼻咽氣道(nasopharyngeal airway)", "口咽氣道(oropharyngeal airway)"], "answer": 0, "explanation": "針對休克及深度昏迷之創傷病人，除了維持呼吸道通暢外，還可能需要給予適當的正壓\n通氣及避免胃充氣，這時用進階呼吸道如氣管內管會是好的選擇。"}, {"id": "PDF050", "category": "Airway / Breathing", "level": "核心", "stem": "您剛完成一個心跳停止病人的氣管插管，並己ROSC。經由第一次確認，上腹都聽不到蠕動音，\n兩邊肺部擴張及呼吸音相同，確認氣管內管位置。當您無法偵測到二氧化碳檢查儀之吐氣末期\n二氧化碳濃度時，此時應採取何種措施？", "options": ["偵測不到吐氣的二氧化碳，通常是由於插管時誤入食道，因此應立即將氣管內管拔除", "心跳停止時，肺血流量降低，造成吐氣之二氧化碳濃度降低，即使氣管內管位置正確，亦\n無法偵測到。故此時改用食道偵測儀(esophageal detector device)。", "如果血紅素飽和度小於95%，就應將氣管內管拔掉", "心跳停止時，沒有任何一種偵測儀是具有確定性的，因此，保留原來氣管內管，而且不須\n再做內管位置之確認動作。"], "answer": 1, "explanation": "此題主要觀念是不能只憑單一方式來確定氣管內管位置，應該要多種方式才能作出判斷。\n心跳停止若已持續一段時間，二氧化碳濃度可能降低，即使氣管內管位置正確，亦無法偵測到\n二氧化碳，而且上腹都聽不到蠕動音，兩邊肺部擴張及呼吸音相同，冒然將氣管內管拔除不妥\n當，此時應用其它方式進一步確認，如食道偵測儀。插管病患狀況變差，在呼吸道及呼吸的部\n分，應以DOPE 口訣來鑑別原因，D-Displacement 移位； \nO-Obstruction 阻塞；P-Pneumothorax 氣胸；E-Equipment failure 裝置失敗，先找問題來源，不\n要立刻將氣管內管拔掉。"}, {"id": "PDF051", "category": "Airway / Breathing", "level": "核心", "stem": "有關Sellick maneuver 的描述，下列何者錯誤?", "options": ["可以防止吸入胃反流物", "已不建議常規使用於心跳停止之患者", "當Endo 推進氣管時，不必等cuff 充氣後，就可以放開", "若作此動作時發生嘔吐，則給予抽吸，鬆開壓力"], "answer": 2, "explanation": "Sellick maneuver 加壓在環狀軟骨，用意是將食道壓扁，避免胃漲氣及內容物反流，而吸\n入胃反流物。執行上須等到cuff 充氣後才可放開，若發生嘔吐時，要放開讓胃及食道的壓力釋\n放，且給予抽吸。因為臨床證據有限，目前已不建議在插管時，例行作環狀軟骨按壓。"}, {"id": "PDF052", "category": "Airway / Breathing", "level": "核心", "stem": "以下何者須強烈懷疑氣管內管未放置於氣管內？", "options": ["可看見管子通過聲帶", "吐氣末二氧化碳偵測器變成黃色", "食道偵測器的球並未膨脹", "胃部沒聽到通氣聲，但肺部上下四點有聽到"], "answer": 2, "explanation": "食道偵測器(Esophageal detector device ，EDD)的球如果在氣管內，球會膨脹，如果在食\n道內則呈塌陷 \n---PAGE 14---\n2026.01 \n14 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF053", "category": "Airway / Breathing", "level": "核心", "stem": "關於呼吸道的建立，下列何者為是？", "options": ["鼻咽通道的放置簡單安全，但不適合用於意識模糊的病患", "口咽通道適合意識清楚的病患", "氣管內管放置時，病患咽、口腔、氣管三軸線最好排列成一直線，以方便插管", "進階呼吸道建立後，壓胸與換氣比仍需維持30：2"], "answer": 2, "explanation": "(A)鼻咽通道主要針對半昏迷或仍有咳嗽及嘔吐反射的病人 (B)口咽通道主要用在完全昏\n迷且沒有咳嗽及嘔吐反射的病人，且須有受過訓練的人放置(D)進階呼吸道建立後，壓胸與換\n氣各做各的，壓胸速率100-120 下/分，換氣10 次/分"}, {"id": "PDF054", "category": "Airway / Breathing", "level": "核心", "stem": "25 歲女性機車騎士與砂石車發生車禍，被救護人員從砂石車底下救出，送入急診室，到院時意\n識不清，呼吸有雜音，脈搏及血壓均微弱，右大腿開放性骨折，此時應該先給予？", "options": ["壓額抬顎法(Head tilt – chin lift)打開呼吸道", "下顎推擠法(Jaw thrust)打開呼吸道", "打上兩條大號靜脈管路給予林格氏液2000 西西", "環甲膜切開術(Cricothyroidotomy)建立呼吸道"], "answer": 1, "explanation": "懷疑頸椎受傷的病人，優先採用下顎推擠法(Jaw thrust)打開呼吸道並盡量避免頸部過度\n伸展；但若無法有效開通氣道或通氣不佳，2025 年ACLS 強調仍應以壓額抬顎法(Head tilt–chin \nlift)確保氣道與通氣。Sellick"}, {"id": "PDF055", "category": "Airway / Breathing", "level": "核心", "stem": "有關插管後確認成功置入氣管內管的方法，以下何者為非？", "options": ["臨床確認方法：包括看著氣管內管通過聲帶，看管子裡的蒸氣，看胸部起伏，聽診呼吸音\n等常被使用，唯這些都非絶對可靠的確認方法", "食道偵測球(Esophageal detector device)沒有膨脹，可能為氣管內管誤置入食道，但也可能\n為正確置入氣管，特別會發生在過胖，懷孕，或有氣喘的病人身上", "潮氣末二氧化碳偵測器(End-tidal CO2 detector)為最準確的方法，若無測得之二氧化碳，則\n應為誤置入食道所致", "就算在插管時看到氣管內管通過了聲帶處，仍應使用其它輔助儀器(如潮氣末二氧化碳偵\n測器)來加以確認"], "answer": 2, "explanation": "潮氣末二氧化碳偵測器(End-tidal CO2 detector)可表示正確的氣管插管位置，假陽性結果\n(食道插管也有CO2 檢測)可發生在碳酸飲料。假陰性結果(氣管插管但沒有測得吐氣二氧化碳)\n可發生在肺栓塞、嚴重低血壓、檢測器被胃內容物汙染和嚴重氣流受阻。"}, {"id": "PDF056", "category": "Airway / Breathing", "level": "核心", "stem": "下列有關於口咽呼吸道(Oropharyngeal Airways)與鼻咽呼吸道(Nasopharyngeal Airways)的敘述\n下列何者錯誤？", "options": ["口咽呼吸道只可用於沒有意識與沒有咳嗽反射的病人", "約有30％病患在放入鼻咽呼吸道後，可能造成呼吸道出血", "口咽呼吸道與鼻咽呼吸道可以使用於顱底骨折的外傷病患", "由經過訓練的人員放置口咽呼吸道於沒有意識的患者屬於Class IIa"], "answer": 2, "explanation": "鼻咽呼吸道(Nasopharyngeal airway)使用禁忌症:顏面創傷或懷疑顱底骨折的外傷病患 \n \n---PAGE 15---\n2026.01 \n15 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF057", "category": "Airway / Breathing", "level": "核心", "stem": "關於呼吸道處置的描述，下列何者正確?", "options": ["心臟休止的病患以袋瓣罩甦醒器(Bag valve mask)給氧時應常規使用環狀軟骨按壓術保護\n呼吸道暢通", "口咽呼吸道(Oropharyngeal airway)適用於嘔吐反射完整的病患", "懷疑顱底骨折的外傷病患可使用鼻咽呼吸道(Nasopharyngeal airway)", "氣管內管(Endotracheal tube)的氣囊膨脹後可減少胃內容物吸入的風險"], "answer": 3, "explanation": "ACLS 已不推薦於心臟停止時例行使用環狀軟骨按壓術。口咽呼吸道適用於完全昏迷，\n且沒有咳嗽或嘔吐反射的病患。鼻咽呼吸道使用禁忌症為顏面創傷或懷疑顱底骨折的外傷"}, {"id": "PDF058", "category": "Airway / Breathing", "level": "核心", "stem": "有關On Endo 前BVM(Ambu bag) bagging 的敘述，下列何者有誤？", "options": ["目前on Endo 前bagging 時，建議常規使用Sellick maneuver (環狀軟骨按壓術)，以避免空\n氣進入胃部。", "呼吸衰竭但尚有循環的病人，Bagging 的時間是依SaO2 上升情況而定", "尚未衰竭的病人，可先用Non-rebreathing mask 提高SaO2 到99-100%後，就可以on Endo", "如只是短暫呼吸抑制且可在短期間恢復，可先用bagging 維持，暫不須考慮插管"], "answer": 0, "explanation": "已不推薦於心臟停止時例行使用環狀軟骨按壓術。"}, {"id": "PDF059", "category": "Airway / Breathing", "level": "核心", "stem": "40 歲男性氣喘病患，因呼吸衰竭經插管治療後轉大醫院作後續治療。在轉送途中你突然發現血\n氧濃度下降，病人嘴唇出現發紺現象，以下處置何者為非？", "options": ["應考量氣管內管滑脫，可看管子裡的蒸氣，看胸部起伏，聽診呼吸音等方法再次確認管子\n的位置", "可嘗試用軟抽吸管往氣管內管抽吸，看是否有痰堵塞", "聽診兩側呼吸音，若其中一邊聽不到，應考慮有氣胸產生", "若病人手腳冰冷，可能因為末梢循環不良致血氧偵測錯誤"], "answer": 3, "explanation": "己插管但出現呼吸問題時，應先排除DOPE 原因(參題50 題說明)"}, {"id": "PDF060", "category": "Airway / Breathing", "level": "核心", "stem": "有關簡單型面罩，下列何者錯誤?", "options": ["建議流速為6-10L/min，可提供氧氣濃度為35-60%", "不建議氧氣流速低於6L/min，以避免二氧化碳滯留", "可有效的提供高濃度的氧氣", "建議張口呼吸病人使用"], "answer": 2, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF063", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "造成PEA 最常見之5H5T 中，不包括下列何者?", "options": ["酸中毒", "冠心症", "肺水腫", "低體溫"], "answer": 2, "explanation": "依據 AHA 2025 ACLS 建議，當病人心臟驟停的節律為 PEA（無脈性心臟電氣活動時）\n應儘早將可逆的的原因排除並給予治療，其可逆的原因為 5H5T依序為：5H(低血氧 Hypoxia、\n低體溫 Hypothermia、低血容 Hypovolemia、高/低血鉀 Hyper/Hypokalemia、酸中毒 Hydrogen \nion)及 5T(心臟冠狀動脈阻塞 Thrombosis coronary、心包膜填塞 Tamponade cardiac、肺栓塞 \nThrombosis pulmonary、張力性氣胸 Tension pneumothorax、藥物中毒 Toxins)。所以答案 C 肺\n水腫為非。"}, {"id": "PDF064", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "院內999 的病患，無意識，無脈搏，在監視器接上之後出現下面的波形，您的組員正等待著\n您進一步的指示，您的醫囑會是：", "options": ["進行氣管內管插管。", "給予Epinephrine 1mg IV。", "先給予壓胸CPR。", "給予去顫電擊。"], "answer": 2, "explanation": "此為PEA，應先給予壓胸CPR 後再給予Epinephrine 1mg IV"}, {"id": "PDF065", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "治療VF 的藥物包括下列何者? \n(1) Amiodarone (2) Epinephrine (3) Adenosine (4) Lidocaine (5) Isoptin", "options": ["2、3", "1、2、4、5", "2、4、5", "1、2、4"], "answer": 3, "explanation": "VF 的治療藥物為: Epinephrine、amoidarone、lidocaine"}, {"id": "PDF066", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "有關心臟停止之心律及其治療，下列何者錯誤?", "options": ["目擊者的心臟停止，約有40%為VF 或是無脈搏VT", "高品質CPR 可矯正VF 或是無脈搏VT", "若VF 延遲電擊，每分鐘急救成功率會下降7-10%", "若VF 病人在等待電擊時有做CPR，每分鐘平均存活率約下降3-4%"], "answer": 1, "explanation": "高品質 CPR 不能矯正VF 或是無脈搏 VT，只能延長VF 到Asystole 的時間"}, {"id": "PDF067", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "有關PEA 治療，下列敘述何者錯誤?", "options": ["無囉音者可考慮快速灌注生理食鹽水，增加循環容積", "應重點評估理學檢查及病史，儘快尋找原因", "Epinephrine 1 mg IV push", "Lidocaine 1 mg/kg IV push"], "answer": 3, "explanation": "PEA 的治療藥物為epinephrine, 而Lidocaine 用於VF 及Pulseless VT \n \n---PAGE 17---\n2026.01 \n17 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF068", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "下列哪一項PEA 原因，較難在床邊迅速診斷及處置?", "options": ["張力性氣胸Tension pneumothorax", "肺栓塞Pulmonary embolism", "低血容Hypovolemia", "心包膜填塞Tamponade cardiac"], "answer": 1, "explanation": "肺栓塞需用電腦斷層來診斷，CPR 時難達成"}, {"id": "PDF069", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "有關PEA，下列何者在初期即較常為寬QRS 波形?", "options": ["低血容", "高血鉀", "心包膜填塞", "張力性氣胸"], "answer": 1, "explanation": "高血鉀的心電圖QRS 會變寬，並導致致命性心律不整"}, {"id": "PDF070", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "56 歲男性，被送至急診時已無呼吸心跳，心電圖顯示寬而緩慢的心律，診斷為PEA。 \n下列原因，何者在PEA 被期較少引起寬而緩慢的PEA？", "options": ["高血鉀(血鉀> 7.0)", "低血容", "藥物中毒(T.C.A、Beta blocker、Calcium channel blocker 等)", "以上皆不可能"], "answer": 1, "explanation": "低血容所導致之PEA，初期大多為窄波之PEA。"}, {"id": "PDF071", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "想要在短時間內找出PEA/Asystole 病人可能原因，快速的理學檢查是不可缺的一環， \n下列何者不包含在內？", "options": ["查看病人頸靜脈是否怒張", "測量病人的深肌腱反射", "聽診病人兩側呼吸音", "以超音波檢視病患的心臟及腹部"], "answer": 1, "explanation": "快速的理學檢查和病史詢問及臨床上的高度懷疑是找出PEA / Asystole 可能原因的方法。\n理學檢查包括從頭到腳的快速評估。沒有脈搏的病人一般而言是沒有深肌腱反射的，也沒有\n辦法依靠此檢查找出可以治療的原因。"}, {"id": "PDF072", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "下列描述，何者錯誤", "options": ["電擊使用於Asystole，反而會使副交感神經放電，減少恢復心律的機會", "高劑量Epinephrine(0.2mg/kg)可增加Asystole 病患出院率", "Atropine 現已不建議使用於Asystole", "PEA 治療流程與Asystole 相同，但更強調要找原因 \n---PAGE 18---\n2026.01 \n18 \n中華急救教育推廣協會ACLS 練習題"], "answer": 1, "explanation": "在1989 及1993 年的研究顯示，Asystole 使用去顫治療結果不但沒有好處，甚至更不好。\n有8 個研究顯示高劑量Epinephrine 和標準劑量相比不能增加cardiac arrest 病患的出院率和神\n經學恢復率。2010 起新Guidelines 持續到2015， 都已經不建議Atropine 用於治療持續性的\nAsystole 或慢的PEA。PEA 與Asystole 治療就是高品質的CPR+藥物（每3-5 分鐘給予\nEpinephrine 1mg IV 推注）及儘快找出可逆轉的原因（5H5T）。"}, {"id": "PDF073", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "PEA 之治療，何者為正確？", "options": ["PEA 病人，在心室心律小於50 bpm 時，才給予胸部按壓", "PEA 之治療成功與否，在於確認及治療產生PEA 之5H 及5T 之病因", "Atropine 可考慮用於治療慢的PEA 之藥物", "PEA 很少是因為低血容積引起，因此靜脈輸液是禁忌，不應該給予"], "answer": 1, "explanation": "當病人失去脈搏以及循環跡象，於心電圖監視器上出現了VT、VF、 Asystole 以外任\n何的心律，皆稱為PEA。Asystole 和PEA 的治療就是CPR+藥物+找原因(5H5T)。Atropine\n已確定不再建議使用在Asystole 或slow PEA。PEA 常見的原因裡有一項是低血容積，若是低\n血容積引起的PEA，就該給輸液。"}, {"id": "PDF074", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "62 歲女性，3 週前剛接受主動脈瓣及二尖瓣置換手術，並服用抗凝血劑。在家中突然不省人\n事送來急診室，醫療團隊給予胸部按壓，插入氣管內管，經過兩次確認位置無誤，並給予100\n％氧氣，胸廓擴張及呼吸音兩側均勻。心電圖出現窄波QRS 心率80 bpm，但摸不到脈搏，心\n臟超音波檢查，沒有心包填塞。以下列何者治療最適合？", "options": ["每3-5 分鐘給予Atropine 1 mg，直到總劑量0.04 mg/kg，然後再給予一次劑量之Vasopressin \n40 單位IV", "每3-5 分鐘給予Sodium bicarbonate 1 mEq/kg，以治療高血鉀症", "Epinephrine 1mg，然後給予輸液推注(Fluid bolus)，並尋找可治療之原因", "儘快會診原本手術之醫師，尋求專科意見"], "answer": 2, "explanation": "依據 AHA 2025 ACLS 建議，PEA 及 Asystole 的治療就是高品質的 CPR+藥物 \n（每 3-5 分鐘給予 Epinephrine 1mg IV 推注）及儘快找出可逆轉的原因（5H5T）。此病人 \nPEA 原因還未找到，但開完刀且服用凝血劑，很可能是出血出造成 hypovolemia，應儘快尋\n求原因；選 C 是適當的答案。選項 A: Atropine 不用在PEA ,選項 B 在尚未明確得知導致\n心臟驟停的原因前都不建議常規給予 Sodium bicarbonate 或其他藥物，選項 D 當尚未確認\n導因或回復自發性心律循環前。"}, {"id": "PDF075", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "下列何種PEA 病人，接受Sodium Bicarbonate 1 mEq/kg 最有效果？", "options": ["二氧化碳過高之酸中毒，及使用減壓治療之壓力性氣胸之病人", "短暫心跳呼吸停止之病人", "已確定有有高血鉀之病人", "已確定有低血鉀之病人"], "answer": 2, "explanation": "只在有高血鉀之病人使用Sodium Bicarbonate 才是標準治療(Class I)有效， \n---PAGE 19---\n2026.01 \n19 \n中華急救教育推廣協會ACLS 練習題 \n但要注意不要單獨使用Sodium Bicarbonate 來治療高血鉀，要合併其它保護心肌細胞及排除\n鉀離子藥物方式治療。在非高鉀或尚未明確得知導致心臟驟停的原因前，不建議常規給予。"}, {"id": "PDF076", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "30 歲精神科男性跳樓自殺後送到急診室，到院時無意識，無脈搏，心電圖監示器顯示心率為\n每分鐘35 次、規則、寬的QRS 波，您首先應如何處置?", "options": ["先建立IV 輸液途徑後，立刻給予atropine 1 mg IV 注射。", "立刻使用TCP，將心率控制在每分鐘70 次。", "立刻聯絡頭部電腦斷層及會診腦神經外科醫師。", "立刻CPR，並尋找可能之5H5T 原因"], "answer": 3, "explanation": "當病人的失去脈搏以及循環跡象時，於心電圖監視器上出現了VT、 VF、Asysytole\n以外任何的心律無論速率多少皆稱為PEA，唯一治療就是高品質的CPR+藥物（每3-5 分鐘\n給予Epinephrine 1mg IV 推注）及儘快找出可逆轉的原因（5H5T）"}, {"id": "PDF077", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "一位26 歲女性因重大車禍被送到急診室來，到院時已無脈搏及呼吸，心電圖顯示規則的有 \nP 波的、窄QRS 心律，速度為40/min，請問此病人的心律是？", "options": ["Idioventricular rhythm", "Asystole", "Atrial fibrillation", "Pulseless electrical activity"], "answer": 3, "explanation": "無脈性心臟電器活動，心臟仍有電氣活動，但電氣活動太微弱，雖可看見EKG 有波形，\n但無法產生脈博"}, {"id": "PDF078", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "一個慢性阻塞性肺疾病(Chronic obstructive pulmonary disease)男性咳嗽多日剛到急診，忽然變\n得很喘，幾分鐘後倒地不省人事。您目擊這個狀況，病人沒有呼吸，偵測不到脈搏，心律監\n視器上呈現如下圖，以下何者為非？", "options": ["給予CPR，胸部按壓速率每分鐘100-120 下", "每三到五分鐘靜脈給予Epinephrine 1 mg", "不應浪費時間找原因，只要繼續胸部按壓和給藥最好", "此狀況下不應電擊，要繼續CPR"], "answer": 2, "explanation": "PEA 與Asystole 唯一治療就是高品質的CPR+藥物（每3-5 分鐘給予Epinephrine 1mg IV\n推注）並儘快找出可逆轉的原因（5H5T），需每兩分鐘或五個循環重新確認心律，每次不得超\n過十秒鐘 \n---PAGE 20---\n2026.01 \n20 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF079", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "天寒地凍的夜晚，一位中年男性被發現倒在陸橋下，全身是酒味，送到急診室時，您是當班\n醫師，發現他沒有自主呼吸，也沒有脈搏，監視器上呈現如下圖，以下何者錯誤？", "options": ["應儘速矯正可能的低體溫", "可考慮使用epinephrine", "儘速電擊比CPR 更有效", "低血鉀、藥物中毒需要列入鑑別診斷"], "answer": 2, "explanation": "Asystole 唯一治療就是高品質的CPR+藥物（每3-5 分鐘給予Epinephrine 1mg IV 推\n注）及儘快找出可逆轉的原因（5H5T），此時並不建議給與使用去顫治療，結果不但沒有好\n處，反而是有害的"}, {"id": "PDF080", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "當發現心律為VF 時，下列敘述何者錯誤?", "options": ["應立即連續給三個連續電擊", "VF 最主要的治療是迅速給予電擊去顫", "電擊一次後應立即CPR 2 分鐘", "當使用單向電擊器，電量使用為360J"], "answer": 0, "explanation": "治療VF 最主要的治療是去顫，CPR 則可延長VF 至asystole 的時間，當VF 去顫成功、心律\n恢復後的前幾分鐘，CPR也可以增加心輸出量。去顫的電量單向電擊器為360J，雙向為120-200J，\n電一次後就要立刻開始心臟按摩。"}, {"id": "PDF081", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "插管病人，心電圖為規則無P 波寬QRS 波，180 次/分，病人無自發性呼吸無脈搏，心肺復甦\n術正在進行中，下列何者處置不適當?", "options": ["持續高品質CPR", "充電200 焦耳後給予非同步去顫一次 (使用雙向電擊器)", "Verapamil 1Amp 靜脈注射", "找出病人無脈搏心室心搏過速原因"], "answer": 2, "explanation": "此題考的是Pulseless VT的處置，CPR+電擊+藥物+找原因。藥物部份可考慮Epinephrine、\nAmiodarone、Lidocaine。"}, {"id": "PDF082", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "關於VF(ventricular fibrillation)及Defibrillation 的敘述，下列何者有誤？", "options": ["對VF 唯一最有效的治療為defibrillation", "高品質的CPR 可以將VF 轉為正常的心率", "VF 若不處理，可能在數分鐘內變成Asystole", "Defibrillation 成功的機率，會隨著時間的延遲而變小 \n---PAGE 21---\n2026.01 \n21 \n中華急救教育推廣協會ACLS 練習題"], "answer": 1, "explanation": "VF 唯一有效的治療就是快速去顫Defibrillation。CPR 可延長VF 到Asystole 的時間，\n但無法將VF 轉成正常的心律，如果發生VF 時不CPR 也不去顫，存活率則每分鐘下降7-10%"}, {"id": "PDF083", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "50 歲男性老菸槍有高血壓病史，長期在某醫院心臟科門診追蹤，一次在候診時忽然自候診椅\n上倒下，以下何者為非？", "options": ["身旁的民眾首先要拍病患肩膀叫喚病人，若無意識反應則立即請人求救", "因為目擊猝死很大的機會是致命性心律不整，因此應立刻給予胸前重擊，再去取得AED", "民眾在發現他無意識反應也沒有呼吸時，不需檢查脈搏便應即刻開始CPR", "旁邊的護理師推來了一台新的沒見過的電擊器，上面可使用的最高電擊電壓是200 J， 在\n不知道機型情況下，若需電擊則直接使用200 J"], "answer": 1, "explanation": "目擊病患倒下時，通用流程為叫叫CAB。目擊猝死有20-40%為VF 所引起，故應在求\n救時請旁人儘快取得AED，並開始施行CPR，而非胸前重擊"}, {"id": "PDF085", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "關於心室纖維顫動的敘述，以下何者錯誤？", "options": ["MgSO4 僅建議使用在torsades 病患，不建議常規使用於心室纖維顫動", "即使在心室纖維顫動變成Asystole 後，仍應該繼續使用電擊治療搶救病人", "Lidocaine 可以考慮使用，劑量為1-1.5 mg/kg", "Amiodarone 可以考慮使用，劑量為300mg 靜脈注射"], "answer": 1, "explanation": "Asystole 為不可電擊心律，應持續高品質CPR 及3-5 分鐘給予Epinephrine"}, {"id": "PDF086", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "2025 年ACLS 指導方針中，對成人的VF 治療敘述，下列何者為非？", "options": ["強調電擊一次後，儘快給予高品質的CPR", "對心室纖維顫動(VF)最有效的治療為去顫電擊(electric defibrillation)", "操作電擊器時，要將電擊板：一個放在病患胸骨右上方，另一個放在左腋窩中線心尖的\n位置，以25 磅的力量壓緊胸部", "針對所有無脈搏患者，皆要分秒必爭的早些電擊"], "answer": 3, "explanation": "電擊為讓心臟停止，去除心律不整並「重開機」，並不是所有無脈搏患者都適用，電擊\n適用於無脈搏的VT 及VF，Asystole 和PEA 的病人則不須電擊"}, {"id": "PDF087", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "晚上六點整，EMT 接獲通知有一位67 歲男性在雜貨店昏倒。趕到現場時間為晚上六點十分，\n發現病患無意識、無呼吸、無心跳，開始CPR。另外一位EMT 接上AED 時，AED 呈現可電\n擊心律，請問下一步處置何者較為適當？", "options": ["停止CPR，待AED 電擊後，再馬上CPR", "停止CPR，待AED 電擊後，再等待AED 確定是否仍為可電擊心律 \n---PAGE 22---\n2026.01 \n22 \n中華急救教育推廣協會ACLS 練習題", "建立高級呼吸道後再電擊", "因為時間超過五分鐘，所以持續CPR，然後送到醫院，現場不用電擊"], "answer": 0, "explanation": "如 AED 分析為可電擊心律，應立刻讓AED 電擊後，再馬上CPR，一直到2 分鐘後，\nAED 會再分析是否為可電擊心律"}, {"id": "PDF088", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "承上題，病患運送到急診室後，仍無意識、無呼吸、無心跳，經過CPR 並給予Epinephrine\n後，心電圖監視仍呈現VF，請問下列藥物何者正確？", "options": ["Amiodarone，劑量靜脈注射300 mg", "Amiodarone，劑量靜脈滴注150 mg", "Lidocaine，劑量靜脈注射0.5-0.75 mg/kg", "Adenosine，劑量快速靜脈注射6 mg"], "answer": 0, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF089", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "承上題，如果給予Epinephrine 及Amiodarone 後ROSC，心電圖監視器終於恢復正常心跳，下\n一步處置何者較為適當？", "options": ["加上Lidocaine 1-1.5 mg/kg", "因為已經恢復正常心跳，需要持續監測心律，待心律不整復發再考慮用藥", "應使用Epinephrine 2-10μg/min，以增加腦部和心臟的血液灌流", "繼續使用Amiodarone，劑量前6 小時1 mg/min，後18 小時0.5 mg/min"], "answer": 3, "explanation": "Amiodarone 可投予 VF/pulseless VT 對 CPR 電擊反應效果不好的病人(class IIb)。起\n始劑量為300mg IV push，然後再給予150mg IV 一次，恢復正常心跳後的維持劑量為前6 小\n時1mg/min，可考慮後18 小時滴注0.5mg/min"}, {"id": "PDF090", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "50 歲男性與太太逛大賣場時，突然感到一陣胸悶，隨之倒地不起。經由119 一路CPR 至到達\n急診室時，意識昏迷，監視器顯示為VF。以下何者處置不合適？", "options": ["立即給予雙相電擊器電擊200J", "電擊後立即胸部按壓，五個循環或兩分鐘後再確認心律", "再次確認心律仍為VF 時，除電擊外藥物可以給予Epinephrine", "如果靜脈輸液尚未建立，亦可以經由氣管內管給與Amiodarone"], "answer": 3, "explanation": "VF 的唯一有效治療是去顫。電擊能量依機型而定，單相型(Mono-phasic) 常見能量\n為360J，雙相性Biphasic 則大多為120-200J，若使用不清楚有效電擊VF 電量的Biphasic 去\n顫器，可以直接調到200J。電擊完，立刻繼續施予5 個循環的CPR 後再確認心律 !! \n(☆電擊完不需再檢查脈搏心律，而應該立刻執行CPR!!)。當IV 途徑建立後，CPR 當中給予\n急救藥物(Bosmin 1 mg IV，每3 到5 分鐘重複一次。 \n \n \n \n---PAGE 23---\n2026.01 \n23 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF091", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "一名35 歲男性，在上班時，突然暈倒，經過一分鐘後，自行醒來。隨即病人被送到醫院急診，\n一開始生命徵象都正常，忽然間，病人發生抽搐，心臟去顫器的心電圖顯示如下，請問一下\n何者處置較正確？", "options": ["若無脈搏，先給予雙相同步電擊100 J", "若有脈搏，先給予雙相同步電擊100 J", "若有脈搏，先給予雙相不同步電擊200 J", "若有脈搏，先給予Amiodarone 150 mg 靜脈注射十分鐘"], "answer": 1, "explanation": "無脈搏的VT 唯一有效治療是去顫，單相型(Mono-phasic) 360J ; 雙相性(Biphasic)則視\n機型而定，大多為120-200J，若使用不清楚有效劑量的雙相去顫器，可以直接調到200J。電\n擊完，立刻繼續施予5 個循環的CPR 後再確認心律 !! (電擊完不需再檢查脈搏心律，而應該\n立刻執行CPR!!) 。若是有脈搏，單型性的 VT 同步從100J 開始電200J 300J 360J。"}, {"id": "PDF092", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "關於「Amiodarone」的敘述何者錯誤？", "options": ["會造成QT 延長", "經由腎臟代謝，故腎衰竭病患應禁止使用", "可治療心室纖維顫動", "常見及最嚴重之併發症為低血壓"], "answer": 1, "explanation": "Amiodarone 重點適應症，即為可使用於已接受CPR、去顫術及Epinephrine，而仍為\n持續之Pulseless VT/VF。但可能造成心電圖 QT 間期延長，所以在QT prolong 所導致的\nWide QRS tachycardia 不宜使用 (最常見即為Torsades de point )在藥物交互作用方面，\nAmiodarone 抑制了肝臟酵素 CYP (cytochrome P450)，因此會和許多藥物產生交互作用，所\n以其他抗心律不整用法在新版ACLS 中強調，應考慮專家會診才可使用"}, {"id": "PDF093", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "有關電擊器(Defibrillator)使用的敘述，何者正確？", "options": ["若已知病人裝有心律調節器(Pacemaker)，則不可使用體外電擊器(Defibrillator)去顫，否則\n會導致心律調節器錯亂而失效", "若使用在因心搏過速而休克(shock)但仍有脈搏的規則QRS 波病人身上，因情況緊急不需\n按同步(Synchronize)鍵，以免延遲病人接受去顫的時間", "當病人為心室顫動(VF)，可考慮直接連續電擊三次以增強效果", "若病人心律為心室顫動(VF)，若使用單相電擊器，應直接非同步電擊360J"], "answer": 3, "explanation": "電擊器(Defibrillator)可使用裝有心律調節器的病人，但應避免直接電擊心律調節器。\n心搏過速而休克(shock)但仍有脈搏的病人，電擊時必須使用同步整流，除非是病人的心律為\n不規則寬QRS 波。心室顫動(VF)目前流程僅電擊一次即開始CPR，連續電擊三次為2010 年\n之前的作法，現今己不再採用。 \n \n---PAGE 24---\n2026.01 \n24 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF094", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "關於張力性氣胸(Tension pneumothorax)導致之PEA，下列何者為誤？", "options": ["於使用呼吸器的病人有較高的發生機率", "可因外傷或肺部疾病如COPD 等所導致", "懷疑時應藉由CXR 儘速診斷", "可藉由氣管偏移及頸靜脈怒張等理學檢查，發現此診斷"], "answer": 2, "explanation": "張力性氣胸為急症，若己為PEA 病患，以CXR 診斷可能更延長救治時間，在臨床高\n度懷疑時即應治療。"}, {"id": "PDF095", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "50 歲男性老菸槍有高血壓病史，長期在某醫院心臟科門診追蹤，一次在候診時忽然在候診椅\n上倒下，該病患倒地第5 分鐘時被慌張的民眾及護理人員扛到急診室交給你，途中沒有CPR，\n以下何者為對？", "options": ["急診室熟練的護理人員不需先CPR，應立即使用電擊器快速察看心律是否心室纖維顫動，\n以爭取立即電擊治療的時效", "心室纖維顫動電擊一次無反應，應緊接著電擊第二次", "心室纖維顫動如果是使用傳統的單向波電擊器應先使用200 J", "電擊後應立刻進行心臟按壓(不用看心律變成什麼)，等CPR 兩分鐘後再檢查心律"], "answer": 3, "explanation": "選項A，目前建議為立即CPR，並儘快接上心電圖監視器以察看心律，電擊器快速察\n看的技巧目前己較少強調。VF 電擊一次後即應立刻CPR，不須額外浪費時間檢查心律。"}, {"id": "PDF096", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "一名精神病患者主訴胸痛、喘及雙手麻至急診，醫師診斷為過度換氣，給予Valium 後，病患\n突然失去意識且摸不到頸動脈脈搏，監視器顯示如下，應如何處置？", "options": ["雙相去顫電擊200J", "單相去顫電擊200J", "單相同步電擊100J", "病患詐病，不予理會"], "answer": 0, "explanation": "無脈性VT 應立即CPR，並儘速給予雙相去顫電擊120-200J。"}, {"id": "PDF097", "category": "心搏停止流程 VF/PEA/Asystole", "level": "核心", "stem": "對於CPR 當中心電圖如下的病患，您首先應給下列那種治療？", "options": ["靜注碳酸氫鈉(NaHCO3)", "靜注氯化鈣(CaCl2) \n---PAGE 25---\n2026.01 \n25 \n中華急救教育推廣協會ACLS 練習題", "靜注Lidocaine", "去顫術"], "answer": 3, "explanation": "此心率為VF，唯一有效治療方式為: 早期去顫(Early Defibrillation \n \n動態心律不整"}, {"id": "PDF099", "category": "心電圖判讀", "level": "核心", "stem": "下列有關於心律不整的判讀，何者有誤？", "options": ["正常心跳速率介於60-100 beats/min", "寬的QRS complex 是指QRS 寬度在心電圖上≧5 小格(0.2 秒)", "P 波的有無可作為判讀心律的參考", "P 波與QRS complex 間的關係可幫助分辨產生心律不整的部位在何處"], "answer": 1, "explanation": "寬的QRS complex 是指QRS 寬度在心電圖上≧3 小格(0.12 秒)"}, {"id": "PDF100", "category": "心電圖判讀", "level": "核心", "stem": "下圖為何種心律？", "options": ["VT (Ventricular Tachycardia)", "Af (Atrial Fibrillation)", "Torsades de pointes", "MAT (Multifocal Atrial Tachycardia)"], "answer": 2, "explanation": "Torsades de pointes 是QT Prolong 所引起的心律不整"}, {"id": "PDF101", "category": "心電圖判讀", "level": "核心", "stem": "下圖為何種心律？", "options": ["Type-I Second degree AV block (2 度1 房室傳導阻滯)", "Type-II Second degree AV block (2 度2 房室傳導阻滯)", "Third degree AV block (3 度房室傳導阻滯)", "Sinus Bradycardia (竇性心搏過緩)"], "answer": 1, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF102", "category": "心電圖判讀", "level": "核心", "stem": "下列心電圖為何種心律？", "options": ["Atrial fibrillation", "Atrial Flutter", "Ventricular Fibrillation", "Ventricular Tachycardia"], "answer": 2, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF103", "category": "心電圖判讀", "level": "核心", "stem": "下列心電圖為何種心律？", "options": ["Atrial fibrillation", "Atrial Flutter", "Ventricular Fibrillation", "Ventricular Tachycardia"], "answer": 3, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF104", "category": "心電圖判讀", "level": "核心", "stem": "下圖為何種心律？", "options": ["1 度房室阻滯 (10 A-V block)", "2 度房室阻滯第一型(20 A-V block， Mobitz type I)", "2 度房室阻滯第二型(20 A-V block， Mobitz type II)", "3 度房室阻滯(30 A-V block)"], "answer": 2, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF105", "category": "心電圖判讀", "level": "核心", "stem": "下圖為何種心律？", "options": ["心室上頻脈 (Paroxysmal Supraventricular Tachycardia)", "心房纖維顫動 (Atrial Fibrillation) \n---PAGE 27---\n2026.01 \n27 \n中華急救教育推廣協會ACLS 練習題", "心房撲動 (Atrial Flutter)", "心室頻脈 (Ventricular Tachycardia)"], "answer": 2, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF106", "category": "心電圖判讀", "level": "核心", "stem": "判讀心電圖如果沒有看到明顯P 波，且合併QRS 變寬，可能推斷為心室之心律不整，其中\nQRS 變寬的定義，為QRS 間期(Duration)≧幾秒？", "options": ["0.12 秒", "0.16 秒", "0.08 秒", "0.2 秒"], "answer": 0, "explanation": "大於0.12 秒(三小格)就稱為Wide QRS。"}, {"id": "PDF108", "category": "心電圖判讀", "level": "核心", "stem": "50 歲酒癮男性腹痛送至急診，突然意識不清無呼吸心跳，心律如下，此心律為?", "options": ["Ventricular Tachycardia", "3∘AV block", "Atrial fibrillation", "Torsades de pointes"], "answer": 3, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF109", "category": "心電圖判讀", "level": "核心", "stem": "60 歲男性因心悸、胸痛、呼吸喘被送到急診室，血壓70/40mmHg，SpO2：88%，心律如下圖\n所示，此心律為：", "options": ["PEA", "PSVT", "Atrial flutter", "Ventricular Tachycardia"], "answer": 3, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF110", "category": "心電圖判讀", "level": "核心", "stem": "第一度房室傳導阻滯(1st degree AV block)定義，為PR interval 大於 ?", "options": ["0.24 秒", "0.20 秒", "0.16 秒", "0.12 秒"], "answer": 1, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF111", "category": "心電圖判讀", "level": "核心", "stem": "下圖為何種心律?", "options": ["Ventricular Tachycardia", "3∘AV block", "Atrial flutter", "Junctional rhythm"], "answer": 3, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF112", "category": "心電圖判讀", "level": "核心", "stem": "25 歲女性感到心悸不適，到急診求治，血壓100/70mmHg，SpO2：94%， \n心律如下圖所示，此心律為? \n \n \n \n \n \n \n---PAGE 29---\n2026.01 \n29 \n中華急救教育推廣協會ACLS 練習題", "options": ["Sinus rhythm", "Atrial flutter", "PSVT", "Atrial fibrillation"], "answer": 2, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF113", "category": "心電圖判讀", "level": "核心", "stem": "發現病患的心電圖有單一的心室早期收縮(Premature ventricular contraction)時，以下處置何者\n較為適當？", "options": ["如病患沒有症狀，可以不用治療", "立即給予Lidocaine 注射", "趕緊給予Amiodarone 滴注大於十分鐘", "準備電擊，雙相可先從100 焦耳開始"], "answer": 0, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF114", "category": "Bradycardia", "level": "核心", "stem": "65 歲男性(體重75 公斤)到急診處就醫，主訴呼吸喘。血壓：80/60mmHg，心跳：45 次/分。\n心電圖監視器顯示一度房室傳導阻斷，經過初步檢查，病人尚無明顯心臟病史或其他重大內\n科疾病。下列藥物何者優先？", "options": ["Atropine 1 mg 靜脈注射", "Isoproterenol 2-10 mcg/min 靜脈點滴", "Lidocaine 75mg 靜脈推注", "Dopamine 2 mcg/min/kg 靜脈點滴"], "answer": 0, "explanation": "針對不穩定的心跳過慢，在沒有可以校正的原因下，藥物的第一線治療是使用\nAtropine(Class IIa)，治療特性為逆轉副交感神經所造成的心律變慢。建議每次1mg， \n3 至5 分鐘可重覆給予，最大劑量3 mg。"}, {"id": "PDF115", "category": "Bradycardia", "level": "核心", "stem": "林先生是75 歲老榮民，今天晚上他吃了一頓大餐後開始肚子不適，因此被送到急診，檢傷發\n現病人體溫36.5 度，心跳每分鐘40 下，呼吸每分鐘14 下，血壓180/100 mmHg，未有胸痛、\n無休克徵侯，心電圖監視器如下，針對此病人心跳過慢的問題如何處理？", "options": ["使用Atropine 1mg 靜脈注射", "靜脈給予Dopamine 5-20 μg/kg/min", "使用經皮心臟節律器(TCP)", "觀察即可，檢查可能的原因， 但須於床邊準備經皮心臟節律器(TCP)，以備緊急變化時\n使用 \n---PAGE 30---\n2026.01 \n30 \n中華急救教育推廣協會ACLS 練習題"], "answer": 3, "explanation": "穩定的心搏過緩暫不須藥物治療，要觀察、監測、找原因，必要時會診專家。此題為3\n度AV Block，建議於床邊準備TCP。"}, {"id": "PDF116", "category": "Bradycardia", "level": "核心", "stem": "病人血壓70/40，盜汗，胸悶，EKG 如圖，最可能有幫助的處理為何？", "options": ["注射Epinephrine 1.0 mg IV", "給予Atropine 1 mg IV push", "使用體外心律調節器(TCP)", "靜脈注射Dopamine 5 mg/kg/min"], "answer": 2, "explanation": "有症狀的心搏過慢可考慮使用TCP，上圖為3 度AV block 合併寬的QRS 波，對Atropine \n反應並不好，因此本題最可能有幫助的處置為C (AD2 藥物使用方式錯誤)"}, {"id": "PDF117", "category": "Bradycardia", "level": "核心", "stem": "何者不是經皮心律調節器(TCP)使用之適應症？", "options": ["有症狀，不穏定之竇性心跳過慢", "低血壓休克之竇性心跳過慢", "完全房室傳導阻滯合併肺水腫", "長時間的無心臟收縮(Asystole)"], "answer": 3, "explanation": "有症狀的心跳過慢是使用TCP 的適應症，根據研究，asystole 使用TCP 沒有好處， \n不建議使用。"}, {"id": "PDF118", "category": "Bradycardia", "level": "核心", "stem": "一位住院病人查房時主訴頭暈、四肢冰冷、潮濕，理學檢查微血管充血時間變長，脈搏規則\n但緩慢45 bpm，血壓為80/60 mmHg。EKG monitor 呈現三度AV block 併有新的寛QRS 波，\n下列處置何者最為適當？", "options": ["Adenosine 6 mg IV push。", "Dopamine 靜脈滴注 5-20μg/Kg/min。", "Isoproterenol 靜脈滴注2-10μg/kg/min。", "Epinephrine 1 mg IV push。"], "answer": 1, "explanation": "因病患目前生命徵象有變化且不穩定，且Type II 二度AV block 或三度AV block 併有\n新的寬QRS 病人，使用Atropine 效果不佳(will not be effective)，此時應考慮給予TCP 或二\n線用藥Epinephrine/Dopamine。"}, {"id": "PDF119", "category": "Bradycardia", "level": "核心", "stem": "您在急診室為一個骨盆脫臼的病人執行徒手復位術，打完鎮靜藥物後卻發現病人呼吸次數越\n來越慢，只剩每分鐘6 次，血壓96/64 mmHg，心電圖監視器上呈現竇性心搏過緩(Sinus \nbradycardia)，針對此病人心跳過慢的問題打算如何處理？ \n \n---PAGE 31---\n2026.01 \n31 \n中華急救教育推廣協會ACLS 練習題", "options": ["先行給氧與輔助通氣", "使用Atropine 1mg 靜脈注射", "靜脈給予Dopamine 5-20 μg/kg/min", "使用經皮心臟節律器(TCP)"], "answer": 0, "explanation": "所有心搏過慢病人應先維持適當的氣道及通氣、給氧及裝置心律監視器，血氧監測器\n及血壓，建立靜脈管道(也就是建立O2 / IV/ monitor)。此題的病人為鎮定藥物所導致之呼吸\n抑制，優先給氧與輔助通氣，或許心跳即可回復。"}, {"id": "PDF120", "category": "Bradycardia", "level": "核心", "stem": "下列何種情況不建議使用Atropine 作為心跳過慢的治療？", "options": ["剛接受心臟移植的陳先生，竇性心搏過緩且有不穩定的症狀", "有心衰竭病史的李太太，有端坐呼吸及喘，第一度房室阻滯(AV block)", "呼吸困難且冒冷汗的邱老先生，竇性心搏過緩，血壓100/40", "昏厥(syncope)的杜老先生，目前血壓70/40，第二度第一型房室阻滯"], "answer": 0, "explanation": "Atropine 為心搏緩慢藥物治療的第一線藥物，在有症狀的竇性心搏過慢及阻滯位置在\n房室節以上的任何AVB 可能有效。在急性心肌梗塞的病人應注意Atropine 所引起的心搏加速\n可能會造成心肌缺血更惡化。心臟移植的病人因無迷走神經的分佈，故Atropine 可能無效。"}, {"id": "PDF121", "category": "Bradycardia", "level": "核心", "stem": "對於心搏過緩Bradycardia 病患的急救過程中敘述，何者為非？", "options": ["Transcutaneous pacing(TCP)的放置是重要的治療方法", "不管病患血壓穩定與否，皆應放置Transcutaneous pacing(TCP)", "等待TCP 期間可以考慮給予靜脈注射阿托平 Atropine(1 mg)", "等待TCP 期間可以考慮給予靜脈輸注腎上腺Epinephrine(2-10μg/min)"], "answer": 1, "explanation": "所有心搏過慢病人應先維持適當的氣道及通氣、給氧及裝置心律監視器，血氧監測器\n及血壓，建立靜脈管道(也就是建立O2 / IV/ monitor)。無症狀的心搏過慢不必治療，但需要\n觀察及監測。若是不穩定，大多數第一線治療為Atropine，除非病患有Type II的二度AV block、\n三度AV block 或三度AV block 且合併新的wide-QRS 病人不應使用Atropine，應考慮立即\nTCP 或二線用藥Epinephrine、Dopamine。"}, {"id": "PDF122", "category": "Bradycardia", "level": "核心", "stem": "68 歲女性因看錯藥袋，將原本一個星期藥量的高血壓藥物一次服下，家屬趕忙將病患送到急\n診，到院時已經配戴氧氣面罩6 L/min，心跳32 bpm，血壓120/80 mmHg，呼吸16 cpm，體\n溫36℃，SpO2 99%。病人神智清楚，且並沒有胸痛胸悶的現象，因時間因素經醫師評估無法\n洗胃，12 導程心電圖為sinus bradycardia，無ST-T 波段變化。請問下列何者為此時最適合之\n處置？", "options": ["持續監測生命徵象", "立刻給予atropine 1 mg iv push", "立刻貼上經皮心臟節律器(TCP)，開始給予體外pacing", "立刻給予aspirin 325 mg 口服"], "answer": 0, "explanation": "所有心搏過慢病人應先維持適當的氣道及通氣、給氧及裝置心律監視器，血壓及血氧\n---PAGE 32---\n2026.01 \n32 \n中華急救教育推廣協會ACLS 練習題 \n監測器，建立靜脈管道(也就是建立O2 / IV/ monitor)。無症狀的心搏過慢不必治療，但須要\n觀察及監測。"}, {"id": "PDF123", "category": "Bradycardia", "level": "核心", "stem": "承上題，病患在急診留觀兩小時後，生命徵象沒有變化，且病患並無出現新的症狀。醫師察\n覺心電圖似乎有變化，床邊的心電圖監視器上的節律如下，請問這是什麼節律？", "options": ["竇性心搏過緩(sinus bradycardia)", "第三度(完全)房室阻斷(complete AV block)", "第二度傳導阻滯，第一型(second degreee AV block，mobitz type I)", "第二度傳導阻滯，第二型(second degreee AV block，mobitz type II)"], "answer": 3, "explanation": "2nd Degree AV block 又可分為兩種： Mobitz Type I and Mobitz type II，共同的特色\n在於P 波後不一定都有QRS 波，偶爾會看到一個QRS 波消失，所以QRS 波看起來是不規則\n的。而分辨Mobitz type I 和II 的方法在於觀察PR interval，Mobitz type I 的PR interval 會\n慢慢延長，然後一個QRS 波不見，在Mobitz type II 則沒有此現象，PR interval 都是固定的，\n但是QRS 波會突然不見。"}, {"id": "PDF124", "category": "Bradycardia", "level": "核心", "stem": "承上題，此時最適合的處置是？", "options": ["持續監測生命徵象", "立刻給予atropine 1 mg iv push", "立刻貼經皮心臟節律器(Transcutaneous pacemaker，TCP)，開始予刺激", "立刻貼上TCP 備用，但不需要立刻給予刺激"], "answer": 3, "explanation": "因病患目前生命徵象沒有變化，且病患並無出現新的症狀，所以暫時不須治療。 \n但Mobitz type II 或3 度AV block，較有變化的可能性，所以可TCP Standby，方便隨時使用。"}, {"id": "PDF125", "category": "Bradycardia", "level": "核心", "stem": "承上題，病患在急診留觀兩小時後，突然開始有冒冷汗，覺得快要昏倒的感覺，護士測量血\n壓發現下降至70/40 mmHg，其餘生命徵象維持不變，此時醫師決定要給予經皮心臟節律器\n(TCP)，以下何者不是合理的處置？", "options": ["在準備TCP 的同時，可先考慮給予Dopamine 滴注。", "使用TCP 時，除了電氣波動外，也要確認是否產生有效脈搏。", "使用TCP 時，當確定心臟能夠穩定地按照設定的節律跳動後，應把電流降低10 mA， \n 避免傷害心臟。", "使用TCP 時，貼片位置要放置於左胸上方與右肩下，需要緊急去顫的時侯才不會妨礙電\n擊。 \n---PAGE 33---\n2026.01 \n33 \n中華急救教育推廣協會ACLS 練習題"], "answer": 3, "explanation": "右側(胸骨)貼片放在右胸的前上方(鎖骨中線下)：左側(心尖)貼片放在左胸的側面下方(腋\n中線位置)，就在左乳房的外側。為便於放置與教學，前方-側壁電極片放置是適當的預設電極\n位置。根據各個病患的特質，可考慮三種替代電極片位置(前方-後方、前方-左肩胛下方，以\n及前方-右肩胛下方) 中的任何一種。使用四種電極片位置中任何一種方式，將電極片置於患\n者的裸胸上，是適當的去顫準備作業。"}, {"id": "PDF126", "category": "Bradycardia", "level": "核心", "stem": "貼上TCP 後，雖然心律已經按照設定每分鐘跳動70 下，並經股動脈確認摸到70 下，但血壓\n還是只有70/40 mmHg，請問以下何者是合理的處置？", "options": ["把電流量往上調高，血壓就會升高", "既然沒用，應把TCP 關掉，以免傷害心臟", "可以給予Dopamine 5-20 ug/kg/min", "可以給予Dobutamine 2-10 ug/kg/min"], "answer": 2, "explanation": "Dopamine (Class IIb)：取其α及ß 作用。可與Epinephine 一起使用或單獨使用以 \n5-20 μg/kg/min 開始滴注，根據病人反應做調整。"}, {"id": "PDF127", "category": "Bradycardia", "level": "核心", "stem": "一位78 歲女性主訴胸悶及冒冷汗到急診，血壓80/40mmHg，ECG monitor 上心律顯示如下， \n下列何者錯誤？", "options": ["此心律為Third degree AV block", "首選藥物Atropine，因為此心律對Atropine 反應良好", "如Atropine 無效，可以考慮使用Dopamine 或Epinephrine", "可使用TCP (Transcutaneous Pacemaker)"], "answer": 1, "explanation": "Atropine 為在有症狀的竇性心搏過慢及阻滯位置在房室節以上的任何AVB 可能有效，\n但針對三度AV Block 合併寬QRS 波則效果欠佳。"}, {"id": "PDF128", "category": "Bradycardia", "level": "核心", "stem": "有關緊急心臟節律器的敘述，下列何者錯誤 ?", "options": ["當Asystole 或PEA 時，不建議用TCP，因研究證實效果不佳", "心跳過緩，有嚴重症狀時，可用TCP 治療", "經靜脈的節律器(Transvenous Pacing)比經皮的TCP 更適合立即用於心搏過緩者", "經靜脈的節律器(Transvenous Pacing)比經皮的TCP 效果好"], "answer": 2, "explanation": "經靜脈的節律器直接作用在心房或心室，效果比經皮節律器好，但無法立即使用。 \nTCP 是對於有症狀心跳過緩的適當選擇。 \n---PAGE 34---\n2026.01 \n34 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF129", "category": "Bradycardia", "level": "核心", "stem": "陳先生是一個50 歲的高中老師，之前有心臟病史規則服藥中，今天早上因為咳嗽多日來看急\n診，檢傷護士發現陳先生心跳很慢(約每分鐘40 下)，於是先行做了心電圖(如下)，陳先生的血\n壓120/80 mmHg，沒有胸痛或喘的情形，對於陳先生目前的心跳問題你打算如何處理？", "options": ["使用Atropine 1 mg 靜脈注射", "靜脈給予Dopamine 5-20 μg/kg/min", "使用經皮心臟節律器(TCP)", "觀察即可，檢查可能的原因，不需緊急處理"], "answer": 3, "explanation": "穩定的心搏過緩病患，可先觀察及監測患者是否有出現組織灌流不足的症狀。若出現\n不穩定徵候即須立即予以緊急處置"}, {"id": "PDF130", "category": "Bradycardia", "level": "核心", "stem": "下列關於第三度房室傳導阻斷的敘述，何者正確？", "options": ["第三度房室傳導阻斷為高危險心律，當病患出現此心律時，須立即使用TCP(經皮心臟節\n律器)，使病人心跳回復正常", "雖為His Bundle 以下之傳導阻滯，Atropine 治療效果仍是很好的", "指心房激動波無法傳入房室結，心室需自行發出激動波來使心室收縮", "心室節律通常規則，與心房節律有明確關連性"], "answer": 2, "explanation": "當心搏過緩對藥物治療無效並導致嚴重症狀時，合理的下一步是暫時性置放TCP。 \n2 度2 或3 度AVB 病患有新的寬QRS 波，此類心搏過緩對Atropine 抗副交感神經作用可能\n無效。第三度房室傳導阻斷：心室節律通常規則，因心房與心室間沒有電衝動傳遞，所以與\n心房節律無明確關連性"}, {"id": "PDF131", "category": "Bradycardia", "level": "核心", "stem": "對於不穩定心搏過緩Bradycardia 病患的急救過程中，在等待Transcutaneous pacing(TCP)放置\n的期間，可以考慮給予阿托平Atropine 靜脈注射。關於此藥物的敘述，下列敘述何者正確？", "options": ["只能給予一次，不得重覆給予", "得重覆給與，次數不限，兩次給藥時間應相距3 至5 分鐘", "應連續給藥六次，每次0.5 mg，總劑量3 mg", "得重覆給與，每次1mg，最高劑量3 mg"], "answer": 3, "explanation": "不穩定心搏過緩阿托平Atropine 靜脈注射的方式為每次1mg，兩次給藥時間應相距3\n至5 分鐘，最高劑量3 mg"}, {"id": "PDF132", "category": "Bradycardia", "level": "核心", "stem": "一位80 歲男性，因呼吸困難及胸悶送入急診，檢傷測得生命徵象為：體溫攝氏36.2 度，心跳\n每分鐘45 下，血壓89/51，呼吸每分鐘約30 次，下列處置何者最不合適？", "options": ["給予氧氣", "接上心電圖監視器並完成12 導程心電圖 \n---PAGE 35---\n2026.01 \n35 \n中華急救教育推廣協會ACLS 練習題", "立刻給予Amiodarone 150 mg 靜脈滴注", "準備經皮心臟節律器"], "answer": 2, "explanation": "不穩定心搏過緩，未有Amiodarone 的角色。"}, {"id": "PDF133", "category": "Bradycardia", "level": "核心", "stem": "王先生是一位51 歲的老師，過去有高血壓及糖尿病的病史，今日突然覺得頭昏及胸口悶痛不\n適，由家人帶入急診。於急診時發現，病人心跳每分鐘45 下，血壓65/35，呼吸每分鐘25 下，\n兩側肺部有囉音，心電圖如下，您將做何處置？", "options": ["狀況緊急，立刻給予Epinephrine 1 mg 靜脈注射", "血壓過低，立刻給予500 ml 生理食鹽水靜脈灌注", "使用經皮心臟節律器(TCP)", "先會診心臟科，待專科來後再決定"], "answer": 2, "explanation": "病人己有囉音，不適合給予生理食鹽水靜脈灌注。Epinephrine 1 mg 靜脈注射為心搏\n停止之劑量，在不穩定心搏過緩不應給予。會診心臟科為正確概念，但在專科來之前，因病\n人己有不穩定症狀，建議仍須先緊急處置。 \n心搏過速治療流程"}, {"id": "PDF134", "category": "Tachycardia", "level": "進階", "stem": "下列何者為鈣離子阻斷劑(CCB)?", "options": ["Diltiazem、Atenolol", "Atenolol、Metoprolol", "Metoprolol、Diltiazem", "Diltiazem、Verapamil"], "answer": 3, "explanation": "Atenolol、Metoprolol 為Beta 阻斷劑(Beta-blocker)。Diltiazem、Verapamil 為鈣離子\n阻斷劑。"}, {"id": "PDF135", "category": "Tachycardia", "level": "進階", "stem": "關於Adenosine 敘述，下列何者錯誤?", "options": ["是穩定、規則、窄QRS 波，心室上心搏過速的治療首選", "也可以用來治療不穩定、規則、窄QRS 波心室上心搏過速", "是Beta-阻斷劑，所以可以治療心室上心律不整", "對於穩定、規則、寬QRS 波的心搏過速可以用來診斷兼治療"], "answer": 2, "explanation": "Adenosine 為內生性嘌呤類核甘酸，而不是Beta 阻斷劑(beta-blocker)。 \n---PAGE 36---\n2026.01 \n36 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF136", "category": "Tachycardia", "level": "進階", "stem": "關於Adenosine 的敘述，下列何者錯誤?", "options": ["半衰期很短，給藥時需快速靜脈推注，並用20ml 生理食鹽水快速推注", "不宜用於不穩定、不規則之多型性寬QRS 波心搏過速", "副作用是臉潮紅、胸悶和呼吸喘，但在氣喘病患仍可小心使用", "藥物治療特性是短暫抑制房室結的傳導"], "answer": 2, "explanation": "Adenosine 會引起呼吸喘及氣管痙攣，因此不可用於氣喘病患"}, {"id": "PDF137", "category": "Tachycardia", "level": "進階", "stem": "關於Lidocaine 的敘述，下列何者不正確?", "options": ["可治療血液動力學上穩定、單型性VT", "可用於不明原因的寬QRS 波心搏過速", "治療特性為鈉離子通道阻斷劑", "2020 年更新強調，此藥可用於預防單型VT 復發或治療頑固性心室心律不整，於冠心症且 \n 心室功能不良的病患是有效的"], "answer": 3, "explanation": "Amiodarone 用於預防單型VT 復發、或治療頑固性心室心律不整。於冠心症且心室功\n能不良的病患是有效的，Lidocaine 較不建議。"}, {"id": "PDF138", "category": "Tachycardia", "level": "進階", "stem": "一位23 歲年輕人主訴心悸，心跳每分鐘160 下，血壓為110/80 mmHg，心電圖為窄QRS 波\n心搏過速且無明顯P 波，下列治療何者正確？", "options": ["Adenosine 靜脈緩慢注射", "Lidocaine 靜脈注射", "Verapamil 靜脈快速推注", "頸動脈竇按摩(carotid sinus massage)"], "answer": 3, "explanation": "此題心律很有可能是PSVT，針對穩定的SVT，可以用藥物或迷走神經刺激治療。藥\n物可用Adenosine 快速的靜脈注射。 迷走神經刺激法(Vagal maneuvers)可用Valsalva \nmaneuver(成功率約17%)：1.憋氣加上腹部用力，作解大便狀2. 誘導噁心法：用手或湯匙挖\n喉嚨使作嘔3.調整呼吸法：深呼吸幾次，然後屏住呼吸直至不能忍受。2015 年發表：半坐臥\n吹氣拉長到15 秒或對著10ml 的針筒用力吹氣，隨即快速平躺，由他人被動式將患者抬高雙\n下肢(此改良的瓦爾薩瓦動作成功率可以達到43%)或是頸動脈竇按摩(Carotid sinus massage)：\n年輕人較沒有粥狀動脈硬化問題，不然要先聽有無頸動脈雜音再操作(成功率約25%)。"}, {"id": "PDF139", "category": "Tachycardia", "level": "進階", "stem": "一位50 歲、70Kg 的男性病人，有心絞痛、糖尿病、高血壓等病史，到急診室求診，主訴胸\n痛、盜冷汗、心悸。心電圖呈現單型VT(Ventricular tachycardia)，心跳160/min、血壓85/60mmHg、\n呼吸26/min。優先處置為何?", "options": ["Lidocaine 100mg 靜脈推注", "Amiodarone 150mg 靜脈推注", "立刻予以200 焦耳去顫電擊", "鎮靜病人後，100 焦耳同步電擊 \n---PAGE 37---\n2026.01 \n37 \n中華急救教育推廣協會ACLS 練習題"], "answer": 3, "explanation": "活人心搏過速且不穩定就要考慮同步電擊，電擊前可以先止痛、鎮靜，但以不\n要延誤同步整流為優先。"}, {"id": "PDF140", "category": "Tachycardia", "level": "進階", "stem": "氣喘病史之75 歲男性，由於頭暈、心悸有一個星期之久，而到急診室求診。心跳：160 bpm， \nBP：100/70mmHg，理學檢查無異常發現，亦無心衰竭現象。12 導程心電圖如下。 \n初步處置包括 ?", "options": ["立即去顫電擊", "O2-IV-Monitor，並監測患者是否有組織灌流不足的症狀", "不須給予治療，暫先觀察即可", "每3 到5 分鐘，給予Epinephrine 1mg IV"], "answer": 1, "explanation": "穩定的心搏過快，初步處置包含O2-IV-Monitor 及12 導程心電圖。心房顫動(Af)若已\n持續一段時間，不應貿然立即電擊校正心律，應會診專科，做心臟超音波確認有無血栓，先\n使用控制心室速率的藥物、抗凝血劑後，再考慮校正心律的藥物。"}, {"id": "PDF141", "category": "Tachycardia", "level": "進階", "stem": "接上述病人。您確定此病人之心房顫動已持續一周，生命跡象穩定。以下治療何者最為適當？", "options": ["給予 Labetalol，減慢心室反應速率(ventricular response)", "給予 Verapamil，減慢心室反應速率", "給予 Amiodarone，將心房顫動轉化成竇性心律(sinus rhythm)", "同步電擊(Cardioversion)"], "answer": 1, "explanation": "Amiodarone 和同步整流電擊是轉換(矯正)心律的用法，在發作大於48 hrs 的Af 有增\n加形成血栓的機會，可能引發中風的危險。Verapamil 為鈣離子阻斷劑，可作為控制心室速率\n的藥物。Labetalol 為Beta 阻斷劑，雖可減慢心室反應速率，但在氣喘病人氣喘患者有引發氣\n喘發作風險，不建議使用。"}, {"id": "PDF142", "category": "Tachycardia", "level": "進階", "stem": "一位27 歲男性患有陣發性心室上心率過速(PSVT)，注射兩劑量之Adenosine 及一劑量之\nVerapamil 後情況仍未改善。注射前HR：180 bpm，BP：98/60 mmHg；注射五分鐘後， \nHR：180，SBP：70 mmHg，意識逐漸喪失。下一步驟應該 ?", "options": ["Atropine 1 mg IV", "Adenosine 12mg IV push", "同步整流100 Joules", "Verapamil 10 mg IV push 1-2 分鐘"], "answer": 2, "explanation": "心搏過速從穩定變成不穩定，應考慮同步整流電擊，SVT 的初始能量多為100 J 開始。 \n \n---PAGE 38---\n2026.01 \n38 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF143", "category": "Tachycardia", "level": "進階", "stem": "一位30 歲、70Kg 的男性病人，無心絞痛、糖尿病、高血壓等病史，到急診室求診，主訴心\n悸。心電圖呈現如下，打了兩次Adenosine 6、12mg 都未見改善，血壓120/78mmHg，呼吸18/min。\n下一步最適當之處置為何？", "options": ["Verapamil 5mg 靜脈慢速推注。", "Lidocaine 100mg 靜脈慢速推注。", "鎮靜病人後，給予100 焦耳之同步整流。", "立刻予以200 焦耳去顫電擊"], "answer": 0, "explanation": "Verapamil 為鈣離子阻斷劑，可作為控制心室速率的藥物，使用方式：初始為2.5-5mg\n靜脈緩慢推注2 分鐘。穩定病患是不建議用同步整流來作為初始治療方式。"}, {"id": "PDF144", "category": "Tachycardia", "level": "進階", "stem": "六十歲男性，過去有心肌梗塞病史。今因心悸、頭暈、持續胸痛至急診室就診。血壓為70/40 \nmmHg，心電圖如下，下列處理何者較適當？", "options": ["給予Amiodarone 150 mg，靜脈滴注10 分鐘", "立即給予心臟整流術(Cardioversion)，不需給予鎮靜止痛藥", "立刻以雙向波(biphasic)給予200 J 電擊除顫(Defibrillation)", "須考慮心臟整流術，使用單向波(monophasic)，以起始能量是100 J 進行同步心臟整流"], "answer": 3, "explanation": "不穩定病患(持續胸痛、低血壓)，建議用同步整流來作為初始治療方式。規則VT 處置，\n有脈搏的病患其治療起始能量是同步整流100 J。"}, {"id": "PDF145", "category": "Tachycardia", "level": "進階", "stem": "70 歲男性的病人，因心悸、盜汗、喘被送到急診室，其心跳每分鐘170 下，血壓為70/40 mmHg，\n心電圖監視器顯示規則及寬的QRS 波，在給予氧氣後，以下的療法何者應首先使用？", "options": ["立即給予Lidocaine 1.5 mg /Kg IV push", "立即給予Adenosine 6mg 在2-3 秒內 IV push", "立即給予Amiodarone 150 mg 10 分鐘 IV drip", "立即準備以雙向波同步電擊 100 焦耳"], "answer": 3, "explanation": "不穩定病患(低血壓)，建議用同步整流來作為初始治療方式。規則VT 處置，有脈搏的\n病患其治療起始能量雙向波是同步整流電擊100 J。 \n \n---PAGE 39---\n2026.01 \n39 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF146", "category": "Tachycardia", "level": "進階", "stem": "一位78 歲老伯伯在公園與人爭執扭打後送到急診室，自述頭暈，胸口不適，意識清楚，血壓\n110/55 mmHg，心跳 160/min，呼吸 28/min，ECG 呈現規則寬的QRS 波形，在給予初步ABCD\n評估後，請問下一步處置何者最不適當？", "options": ["給予氧氣，靜脈輸液，詢問病史，並完成十二導程心電圖", "心電圖懷疑為心室頻脈(VT)，立即給予雙向電擊去顫200 J", "心電圖懷疑為心室頻脈，給予靜脈滴注Amiodarone 控制心律", "尋找可能原因，並適時照會專家"], "answer": 1, "explanation": "穩定的心搏過速病患，建議評估病患並找尋可能的原因(並適時照會專家)用藥物來作為\n初始治療方式。有脈搏的規則 VT 病患其治療能量是同步整流100J，不可去顫電擊。"}, {"id": "PDF147", "category": "Tachycardia", "level": "進階", "stem": "一名30 歲女性，過去有甲狀腺機能亢進的病史，但無規則服用藥物。凌晨到急診來，一身酒\n氣，主訴胸悶、心悸，生命徵象：體溫38 度、心跳每分鐘130 下、血壓105/43 mmHg， \n心電圖如下，請問以下何者處置較正確？", "options": ["給予支持性治療如退燒、生理食鹽水靜脈注射即可", "給予雙相同步電擊50 J", "給予雙相同步電擊100 J", "給予Amiodarone 150 mg 靜脈注射10 分鐘"], "answer": 0, "explanation": "發生竇性心搏過速時，建議評估病患並找尋可能的原因以及治療處理潛在的原因，而\n非以抗心律不整藥物來作為初始治療方式。竇性心率的速率上限與年齡有相關(計算方式為\n220-年齡/分鐘)"}, {"id": "PDF148", "category": "Tachycardia", "level": "進階", "stem": "關於心室上頻脈(supraventricular tachycardia)的治療，何者為非？", "options": ["迷走神經刺激(vagal maneuvers)可終止約20%-25%的心室上頻脈", "Adenosine 不可使用在孕婦身上", "Adenosine 的副作用有臉潮紅，呼吸困難和胸痛", "乙型阻斷劑(β-blockers)用在有肺部疾病的病人要小心支氣管收縮"], "answer": 1, "explanation": "Adenosine 於懷孕是安全有效的。一般的治療效果較快且安全，少副作用，即使副作用\n發生也是短暫性的(如：臉潮紅、胸悶)，唯氣喘病患要禁用"}, {"id": "PDF149", "category": "Tachycardia", "level": "進階", "stem": "一個72 歲男性因為心悸而來急診求診，意識清楚，呼吸平順，血壓145/85 mmHg，心跳不規\n則約每分鐘155 下，心電圖上QRS 小於0.12 秒，病人說他平常就有心率不整。請問您要如何\n治療這位病人？", "options": ["立刻同步電擊整流(Synchronized cardioversion)，單相100 焦耳", "立刻非同步電擊(non-Synchronized shock)，單相360 焦耳", "靜脈給予Amiodarone 轉換心率(rhythm convert) \n---PAGE 40---\n2026.01 \n40 \n中華急救教育推廣協會ACLS 練習題", "靜脈給予Diltiazem 控制速率(Rate control)"], "answer": 3, "explanation": "穩定的心搏過速病患，建議找尋可能的原因，並適時照會專家，可用藥物來作為初始\n治療方式。不規則窄的QRS 波病患，其治療方式主要以降低房室結傳導的藥物來控制心室心\n率為主。Amiodarone 和同步整流電擊是轉換(矯正)心律的用法，在發作大於48 hrs 的Af 有\n增加形成血栓的機會，可能引發中風的危險。"}, {"id": "PDF150", "category": "Tachycardia", "level": "進階", "stem": "乙型阻斷劑(β-blockers)的使用禁忌為何？ \n(1)低血壓(收縮壓< 90 mmHg)；(2) 急性充血性心衰竭； \n(3) 心律過慢(每分鐘小於50 下)；(4) 支氣管痙攣", "options": ["1，3", "1，2，3", "1，3，4", "1，2，3，4"], "answer": 3, "explanation": "乙型阻斷劑的禁忌症原文如下：bradycardias，second-degree 或third-degree heart block，\nhypotension，severe congestive heart failure，lung disease associated with bronchospasm，atrial \nfibrillation or atrial flutter associated with known pre-excitation (WPW) syndrome (早激發引\n起的沃夫-巴金森-懷特症候群等相關心律不整) 。"}, {"id": "PDF151", "category": "Tachycardia", "level": "進階", "stem": "一名24 歲年輕女性因酒後胸悶心悸、吸不到氣至急診求診，到院時血壓95/65 mmHg，脈衝\n血氧監測器血氧濃度為100%，心音與兩側呼吸音均正常，心電圖監視器顯示如下，此時正確\n的處置為？", "options": ["不必矯正心律，先安撫病患情緒，讓呼吸放慢，再檢查是否有其他問題", "Normal saline 250 ml 快速輸注，如未改善，再給予Normal saline 250 ml", "給予迷走神經刺激術(Vagal maneuver)", "給予Adenosine 6 mg 快速靜脈輸注，如未改善，再給予adenosine 12 mg"], "answer": 0, "explanation": "發生竇性心搏過速時，建議評估病患並找尋可能的原因，而非以藥物來作為初始治療\n方式。"}, {"id": "PDF152", "category": "Tachycardia", "level": "進階", "stem": "ㄧ位 75 歲有心律不整的男性，在與家人吵架後吞了 10 多顆的Flecainide 抗心律不整藥物，\n這位男性病患被送至急診時意識清楚抱怨有心悸的感覺，EKG 如下圖是單型的 VT，RR：\n18/min， 血壓：120/75 mmHg，SaO2：98%，請問下面的處置何者最適當？ \n \n \n---PAGE 41---\n2026.01 \n41 \n中華急救教育推廣協會ACLS 練習題", "options": ["給予病人鎮靜止痛，然後100Ｊ同步電擊", "Amiodarone 300 mg 靜脈推注", "Labetalol 5mg 靜脈推注", "Lidocaine 1-1.5 mg/kg 靜脈滴注"], "answer": 3, "explanation": "穩定病患，建議評估病患並找尋可能的原因(並適時照會專家)，用藥物來作為初始治療\n方式。Amiodarone 此病患應為靜脈滴注治療使用：150mg 滴注10 分鐘。Labetalol(Trandate)\n為乙型交感神經阻斷劑，用於治療高血壓之病患而非心律不整患者。Lidocaine 則可使用在心\n室性心律不整的急性治療，初始劑量1-1.5mg/kg 靜脈滴注5 分鐘，需要時，每5-10 分鐘重複\n給0.5-0.75mg/kg 滴注，最大累積劑量為3mg/kg，維持劑量為1-4mg/kg。"}, {"id": "PDF153", "category": "Tachycardia", "level": "進階", "stem": "急診室一名等待住院的66 歲女性病患，其心電圖監視器突然顯示如下心律，病患意識清楚，\n無特別不適，血壓140/88 mmHg，此時正確的處置為？", "options": ["給予迷走神經刺激術，作頸動脈竇按摩(carotid sinus massage)", "給予Adenosine 6 mg 快速靜脈輸注", "給予Amiodarone 300 mg 靜脈快速注射", "靜脈注射鎮靜藥物後，給予同步心臟整流(synchronized cardioversion)100 焦耳"], "answer": 1, "explanation": "穩定病患，建議評估病患並找尋可能的原因並治療處置(並適時照會專家)用藥物來作為\n初始治療方式。Amiodarone 於此病患應為靜脈滴注使用。穩定的規則VT 病患其治療先不考\n慮同步整流。穩定、規則、寬QRS 的心搏過速，有機會是SVT with aberrancy，可以先嘗試\nAdenosine。"}, {"id": "PDF154", "category": "Tachycardia", "level": "進階", "stem": "有一位25 歲年輕女性，偶而有突發性心悸的情形，有時候心悸只要用力咳嗽、或是深呼吸憋\n氣，就會突然停止，有時後症狀比較嚴重，需要掛急診，每次都是打打點滴就會好。今天在\n上班的時候，喝了一杯咖啡，突然又有心悸的情形，在辦公室是試了好幾次咳嗽、或是深呼\n吸憋氣，都沒有效，所以至急診室求診。12-lead 顯示的心律如下圖，請問病人最有可能的心\n律是？ \n \n \n \n \n---PAGE 42---\n2026.01 \n42 \n中華急救教育推廣協會ACLS 練習題", "options": ["竇性心律過速 (sinus tachycardia)", "心房撲動 (atrial flutter)", "陣發性心室上心搏過速 (paroxysmal supraventricular tachycardia)", "心房顫動 (atrial fibrillation)"], "answer": 2, "explanation": "沒有P 波而且是快且規則的窄QRS 波， 所以是paroxysmal supraventricular \ntachycardia(PSVT)陣發性心室上心搏過速"}, {"id": "PDF155", "category": "Tachycardia", "level": "進階", "stem": "有關Adenosine 的描述，下列何者錯誤?", "options": ["可用來診斷窄的QRS 心律過速", "初劑量為6mg，可重複12mg 一次", "給藥時應慢慢滴注", "副作用有臉潮紅或幾秒缺血似的胸痛症狀"], "answer": 2, "explanation": "Adenosine 的半衰期小於10 秒，注射時要快速推注(push)，手臂抬高，合併生理食鹽水\n20ml 快速靜脈推注(Class I)，使之快速到達心臟，短暫抑制房室結的傳導，可治療規則的寬或\n窄QRS 之心律過速，如PSVT。2020 年更新建議劑量為6mg，可重複12mg 一次，副作用有\n臉潮紅、胸悶及呼吸喘。"}, {"id": "PDF156", "category": "Tachycardia", "level": "進階", "stem": "關於各種不穩定型心搏過速，常見建議電擊起始劑量，何者為非？", "options": ["Af (Atrial Fibrillation) ─ 同步整流50J", "有脈搏的VT (Ventricular Tachycardia) ─ 同步整流100J", "PSVT (Paroxysmal Supraventricular Tachycardia) ─ 同步100J", "規則的 AF (Atrial Flutter) ─ 同步200J"], "answer": 0, "explanation": "根據2025 年 ACLS 更新建議依廠商建議而定，常見心搏過速(有脈搏)治療流程圖， \n初始建議同步整流(Synchronized Cardioversion)劑量 \n●窄、規則(PSVT)：100J \n●窄、不規則(Atrial Fibrillation；Atrial Flutter)：200J(雙相)或 200J(單相) \n●寬、規則（Ventricular tachycardia）： 100J \n●寬、不規則：去顫劑量(不須同步)"}, {"id": "PDF157", "category": "Tachycardia", "level": "進階", "stem": "下列何種情況應先使用同步整流(Synchronized cardioversion) 之電擊治療？", "options": ["60 歲男性抱怨全身無力，心電圖監視器呈現第三度房室傳導阻滯", "65 歲男性意識昏迷，心電圖監視器呈現心室纖維顫動 (VF)", "70 歲女性突發性胸悶，意識清楚，血壓低，心電圖監視器呈現心房撲動 (AF)", "28 歲女性心悸，血壓及呼吸正常，心電圖監視器呈現上心室心搏過速 (SVT) \n---PAGE 43---\n2026.01 \n43 \n中華急救教育推廣協會ACLS 練習題"], "answer": 2, "explanation": "心搏過速處置流程，有組織灌流不足的症狀如意識不清、胸痛、低血壓、急性肺水腫\n等，要考慮立刻同步電擊，心悸是主觀上覺得心跳過快，並非客觀上有灌流不足之情形。 \nB 選項應該立刻去顫(defibrillation)，而非同步整流。"}, {"id": "PDF158", "category": "Tachycardia", "level": "進階", "stem": "有關Amiodarone 的描述，下列何者正確", "options": ["治療Vf 時，Amiodarone 是必須優先選擇的治療方式", "治療Vf 時，劑量為150mg，IV 10 分鐘", "若使用電擊治療讓心跳回來，必須使用Amiodarone 維持劑量來預防復發", "維持劑量為，前6 小時 1mg/min，後18 小時0.5mg/min"], "answer": 3, "explanation": "VF 的治療class I 是去顫，使用Amiodarone 治療VF 的劑量是300mg，目前在ROSC\n後使用Amiodarone 來預防VF 復發僅有小規模研究證實有效，待更大型研究結果分析。\nAmiodarone 用來治療tachy-arrhythmias 時的維持劑量為，前6 小時 1mg/min，後18 小時\n0.5mg/min。"}, {"id": "PDF159", "category": "Tachycardia", "level": "進階", "stem": "依據ACLS 心搏過速處置流程，下列何種情況要考慮立刻同步電擊？ \n1.心悸 2.意識不清 3.頸靜脈怒張、兩側肺有囉音 4.血壓 70/40 mmHg", "options": ["1、2、3", "2、3、4", "3、4", "1、2、4"], "answer": 1, "explanation": "以上要了解病患是否有出現組織灌流不足的臨床徵候(意識改變、缺血性胸痛、急性心\n臟衰竭、低血壓等休克徵象)。"}, {"id": "PDF160", "category": "Tachycardia", "level": "進階", "stem": "一名19 歲男性，過去並無特別病史，今天在上體育課跑4000 公尺快要結束時，突然昏倒，\n隨後意識漸漸清醒，到急診時，血壓75/50 mmHg，心電圖顯示如下，請問下列何者處置較不\n適當？", "options": ["在去顫器備好在旁之下，可先嘗試給予Adenosine 6 mg 快速靜脈注射", "給予500 ml 生理食鹽水靜脈滴注", "給予單向同步整流100 J", "給予病人beta 阻斷劑或鈣離子阻斷劑靜脈注射"], "answer": 3, "explanation": "beta 阻斷劑或鈣離子阻斷劑靜脈注射後的副作用為：低血壓、心搏過緩及引發\n心臟衰竭)。 \n \n---PAGE 44---\n2026.01 \n44 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF161", "category": "Tachycardia", "level": "進階", "stem": "對於心電圖出現下列心律之病人，血壓106/82 mmHg，意識清楚，此時之合適治療應為 ?", "options": ["同步整流術(cardioversion) ，單相l00 J", "去顫術(defibrillation)，雙相200 J", "CPR", "Amiodarone 150 mg IV drip >10 分鐘"], "answer": 3, "explanation": "穩定的VT 可用Adenosine 暫時降低心室心率，來幫助辨識及建立心律診斷(Class IIb)。\n也可以考慮靜脈滴注amiodarone、procainamide或sotalol來治療寬QRS波心搏過速(Class IIb)。"}, {"id": "PDF162", "category": "Tachycardia", "level": "進階", "stem": "您準備同步整流(Cardioversion)一位臨床狀況不穩定之心搏過速患者，監視器顯示如下， \n電擊方式及能量是?", "options": ["同步整流50 焦耳", "同步整流200 焦耳", "雙向去顫200 焦耳", "單向去顫200 焦耳"], "answer": 1, "explanation": "不穩定心搏過速以同步整流為原則，去顫則是針對 VT/VT 合併心搏停止之患者。此\n心電圖是窄 QRS 的心律，有鋸齒狀 P 波，應為 Atrial flutter，可從 200J 開始同步整流。 \n \n急性冠心症治療(ACS)"}, {"id": "PDF163", "category": "ACS", "level": "進階", "stem": "有關ACS，下列何者錯誤 ?", "options": ["早期打通血管很重要", "因ACS 猝死的病人，52%送醫院前就已死亡", "ACLS 強調，所有ACS 的病人，不論血壓為何，都應給MONA 治療", "Unstable angina、NSTEMI 的病人，不適合給血栓溶解劑"], "answer": 2, "explanation": "最常見引發突發性心因性死亡 (Sudden cardiac death)的直接原因。在國外，ACS 到院\n前死亡佔了約二分之一。 早期打通血管減少梗塞面積擴大很重要。MONA 為morphine、O2、\n---PAGE 45---\n2026.01 \n45 \n中華急救教育推廣協會ACLS 練習題 \nNTG、aspirin，其中morphine 和NTG 在血壓低的時候為禁忌症。Unstable angina 及Non-STEMI\n不能給血栓溶解劑，可使用抗凝血劑。"}, {"id": "PDF164", "category": "ACS", "level": "進階", "stem": "有關經皮冠狀動脈介入治療Primary PCI 的敘述，下列何者正確 ?", "options": ["STEMI 病人，應等血栓溶解劑治療無效後，再給Primary PCI", "所有STEMI 的病人，急性期就應該儘快做PCI，沒有條件限制", "病人最好在入急診後，60 分鐘內到導管室門口，90 分鐘內打通血管", "根據研究，病人預後比血栓溶解劑差"], "answer": 2, "explanation": "STEMI的病人若送至能做心導管技術的醫院且該施術醫師一年至少做75例心導管的話，\n接受Primary PCI 的病人預後比血栓溶解劑要好。標準是病人到院60 分鐘內要到導管室門口，\n90 分鐘內要打通血管，至於是使用血栓溶解劑或是Primary PCI，則是看醫院的能力。Door to \ndata，data (EKG) to decision， decision to drug 是四個主要治療的 key point 稱為 4Ds，必需\n儘量縮小每個環節中的延誤。"}, {"id": "PDF165", "category": "ACS", "level": "進階", "stem": "若病人胸痛係因心臟引起，所謂MONA 治療，下列何者有誤?", "options": ["Morphine 2-4mg IV", "O2 4-6L/min", "NTG 靜脈滴注", "Aspirin 162-325mg 咬碎後吞下"], "answer": 2, "explanation": "MONA 為Morphine、O2、NTG、Aspirin、Morphine(嗎啡)2-4mg IV(若NTG 無法緩解\n胸痛)。缺血性胸痛，給予Oxygen 氧氣 4L/min 、硝化甘油舌下含片、阿斯匹靈 162 to 325 mg ，\n其中morphine 和NTG 在血壓低的時候為禁忌症，NTG 可用舌下含片或噴劑，不是IVF。"}, {"id": "PDF166", "category": "ACS", "level": "進階", "stem": "病人因為嚴重壓迫性胸痛，超過30 分鐘，到急診室求診，BP：120/75 mmHg、HR：60 bpm，\n12 導程EKG 顯示規則竇性心律60 bpm。給予Aspirin 及鼻管O2 5L/min，NTG 無法緩解其疼\n痛。下一步驟應使用何種藥物？", "options": ["Atropine 1 mg IV", "Lidocaine 1-1.5mg/kg", "Furosemide 20-40mg IV", "Morphine 2-4mg IV"], "answer": 3, "explanation": "對於急性冠心症病人，MONA 是第一線治療，Morphine 2-4mg IV、O2 4L/min、NTG\n舌下含片、Aspirin (162-325mg)。 \n \n \n \n \n \n---PAGE 46---\n2026.01 \n46 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF168", "category": "ACS", "level": "進階", "stem": "ACS(急性冠心症)的治療中，可有效降低病患死亡率的措施為以下何者？", "options": ["立即給予高濃度的氧氣，確保氧氣濃度在98%以上", "立即給予NTG 舌下含片，以舒緩病患症狀", "立即給予ASPIRIN 162-325 MG 口服", "給予O2/IV/MONITOR 後，先不用給藥，立即去連絡心臟科專家會診"], "answer": 2, "explanation": "早期給予阿斯匹靈可減少死亡率。很多研究支持其安全性，除非有阿斯匹靈過敏，否\n則應針對所有 ACS 病人盡快給予。阿斯匹靈經由近乎完全抑制 Thromboxane A2 形成以快\n速產生抗血小板效應，其減少血栓溶解治療後冠狀動脈再阻塞及缺血症狀的復發。標準劑量\n建議為162 到 325 毫克。嚼食或溶解的阿斯匹靈比吞食的更容易吸收。"}, {"id": "PDF169", "category": "ACS", "level": "進階", "stem": "下列何種病人，發生AMI 時較容易出現非典型或模糊不確定之症狀？ \n1.年輕人 2.老年人 3. 糖尿病患者 4. 女性患者", "options": ["1、2、3、4", "1、3、4", "2、3、4", "3、4。"], "answer": 2, "explanation": "胸痛為最常見症狀，但不一定有。病人易有胸部重壓感，常在運動/用力後發作，有危\n險因子的人應特別注意： 年紀(男>45，女>55)、抽菸、三高等 。但易出現非典型、罕見或模\n糊不確定之胸痛症狀者有糖尿病、老年人、女性患者。"}, {"id": "PDF170", "category": "ACS", "level": "進階", "stem": "一位70歲男性STEMI病患，主訴胸悶、冒冷汗，呈現端坐式呼吸，血氧90%，血壓80/60 mmHg，\nEKG 監視器顯示為竇性心搏過速，速率為140/min，理學檢查時發現頸靜脈怒張，兩側肺葉有\n明顯囉音，準備要做心導管，但病人卻因急性肺水腫而無法躺平，此時應先給予何種處置？", "options": ["Morphine 3 mg IV 。", "舌下給予NTG 一顆 。 \n---PAGE 47---\n2026.01 \n47 \n中華急救教育推廣協會ACLS 練習題", "先給予Verapamil 2.5-5 mg IV slowly push 讓心跳過速減緩。", "給予氣管內管插管，先維持呼吸道及呼吸。"], "answer": 3, "explanation": "此為急性冠心症情境：應優先處理ABC 並評估缺氧/呼吸窘迫；Aspirin 為核心治療之\n一，NTG 需注意低血壓/右心梗塞等禁忌；morphine 僅在疼痛或焦慮無法控制且其他處置不足\n時考量。呼吸窘迫者可先穩定呼吸道（必要時插管）並處理根本原因（如肺水腫）。 \n補充說明，AHA 2025 治療建議（延續並強調避免不必要給氧）有關於氧氣之建議： \n（1）所有懷疑ACS 之患者，當合併有呼吸窘迫、血氧飽和度<90%、或有肺水腫/肺充血時皆 \n須給氧(class I ) \n（2）ACS 患者Sat 如果大於或等於94%，則不需氧氣補充 \n（3）減緩心肌缺氧造成之傷害 \n（4）須避免患者缺氧 ，若需要，考慮早期插管 \n（5）針對沒有呼吸窘迫跡象及Sat 正常的病患，給予氧氣不一定有好處。"}, {"id": "PDF171", "category": "ACS", "level": "進階", "stem": "關於冠心症(acute coronary syndrome)的治療，下列何者為非？", "options": ["懷疑STEMI 的病人應常規使用MONA 治療", "Aspirin 對於心肌梗塞或不穩定心絞痛的病人皆有好處", "Heparin 在使用劑量上為初始劑量60U/kg，然後滴注12 U/kg/hr", "ST 段上升心肌梗塞(STEMI) 在24 小時之內若無禁忌症，可以考慮使beta-blocker、Statin\n及ACEI"], "answer": 0, "explanation": "本題依原題庫答案整理；重點請搭配 ACLS 演算法複習。"}, {"id": "PDF172", "category": "ACS", "level": "進階", "stem": "關於冠心症的處理時間建議，下列何者為非？", "options": ["在進入急診20 分鐘之內，應完成心電圖判讀、生命徵象監測及應有的一般性治療", "經評估為STEMI 的病人，決定給予t-PA 的時間應為入院後的 30 分鐘內", "評估為STEMI 的病人，若該醫院無法進行心導管時，應於30 分鐘之內轉出", "經評估為STEMI 的病人，決定給予心導管時，應於90 分鐘之內打通血管"], "answer": 0, "explanation": "Door-to-EKG (D2E) ≤ 10 min \nDoor-to-needle (D2N) ≤ 30 min \nDoor-in to door-out (DIDO) ≤ 30 min \nDoor-to-balloon (D2B) ≤ 90 min \n其中Door-in to door-out (DIDO) 指的是當貴院無法執行心導管等切確治療時，應儘速將病人\n轉院之時間目標，從進門(Door-in 到轉出Door-out，目標為30 分鐘，是ACS 品管指標的一環。 \n \n \n---PAGE 48---\n2026.01 \n48 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF173", "category": "ACS", "level": "進階", "stem": "對於非ST 段上升心肌梗塞(NSTEMI)或不穩定心絞痛的病人，下列何者非高危險群病人？", "options": ["治療之後仍然有持續頑固的胸痛", "復發性或持續性的ST 節段的變化", "血流動力學不穩或有心臟衰竭的徵候時", "竇性心搏過速的病人"], "answer": 3, "explanation": "根據ACLS，治療後有持續頑固胸痛，或有復發性或持續性的ＳＴ節段變化，以及血\n流動力學不穩或有心衰竭癥候的患者都為高危險群的病人，而竇性心搏過速常因發燒、貧血\n或休克等非心因性因素引起。"}, {"id": "PDF174", "category": "ACS", "level": "進階", "stem": "對於胸痛的判斷，下列何者為非？", "options": ["冠心症的胸痛可能會伴隨頭昏、流冷汗、噁心等症狀，但若有糖尿病的病人可能會不明\n顯", "胸痛可能來自於胃食道逆流、食道炎，所以若用胃乳可改善的患者，可以完全排除心絞\n痛引起胸痛的可能性", "心臟引起的胸痛可能會輻射到下巴、喉嚨、左肩、左前臂及背部等區域", "心因性的胸痛可以因為活動而引發，是悶悶的感覺，但是休息時後也可能發作"], "answer": 1, "explanation": "造成胸痛的原因有很多種，就算是其他原因導致的非心因性胸痛，在面對有心臟高危\n險風險的患者仍不能因為症狀緩解就排除心絞痛的可能"}, {"id": "PDF175", "category": "ACS", "level": "進階", "stem": "關於Nitroglycerin 靜脈注射何者為正確？", "options": ["藥理機轉可使冠狀動脈平滑肌收縮，提昇後負荷，讓血壓上昇，以增加冠狀動脈血流", "AMI 的病人即使血壓小於90 mmHg 仍應使用", "適合給予右心室心肌梗塞的病人", "病人於24 小時內使用過Phosphodiesterase 抑制劑時(如威而鋼)，應避免使用該藥"], "answer": 3, "explanation": "Phosphodiesterase 類藥物會加強硝酸鹽藥物的降血壓效果，造成血壓過低而危及生命。"}, {"id": "PDF176", "category": "ACS", "level": "進階", "stem": "使用在急性心肌梗塞病患的藥物，下列何者錯誤？", "options": ["要進行PCI 的病人，使用Heparin 無益處且可能有害", "懷孕後期不建議使用ACE inhibitors", "血壓過低(收縮壓＜100 mmHg)不建議使用B-Blockers", "嚴重心搏過緩(HR＜50 bpm) 不建議使用Nitroglycerin"], "answer": 0, "explanation": "在ACLS，抗凝血治療 (anticoagulant therapy 證據等級C 專家意見)：Heparin (UFH， \nunfractionated heparin 傳統未分段肝素)可用於無論是進行 primary PCI 或血栓溶解劑治療的\n病患，而 Enoxaparin (LMWH， low-molecular-weight heparin 低分子量肝素)可用於血栓溶解\n劑治療的病患。 \n---PAGE 49---\n2026.01 \n49 \n中華急救教育推廣協會ACLS 練習題"}, {"id": "PDF177", "category": "ACS", "level": "進階", "stem": "對於急性冠心症
